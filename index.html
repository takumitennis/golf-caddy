<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caddygate ｜ 準備中</title>
  <meta name="description" content="Caddygate は現在サイトリニューアル準備中です。ローンチ情報は追ってご案内いたします。" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
      color: #2C4A3B;
      background: #F5F0E6;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 48px 32px;
    }
    .symbol {
      width: 56px;
      height: 56px;
      margin: 0 auto 28px;
      opacity: 0.95;
    }
    .brand {
      font-family: "Cormorant Garamond", "Noto Serif JP", serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }
    .brand-ja {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #5C5C5C;
      margin-bottom: 40px;
    }
    .message {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #1A1A1A;
      margin-bottom: 32px;
    }
    .meta {
      font-size: 0.82rem;
      color: #888;
      line-height: 1.7;
      padding-top: 28px;
      border-top: 1px solid #E8E2D5;
      margin-top: 32px;
    }
    .meta strong {
      color: #5C5C5C;
      font-weight: 500;
    }
    @media (max-width: 480px) {
      .brand { font-size: 1.8rem; }
      .message { font-size: 0.98rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="symbol" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="10" y1="14" x2="54" y2="14" stroke="#2C4A3B" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="14" x2="14" y2="54" stroke="#2C4A3B" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="14" x2="50" y2="54" stroke="#2C4A3B" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="22" x2="50" y2="22" stroke="#2C4A3B" stroke-width="2"/>
      <polyline points="32,30 40,36 32,42" stroke="#2C4A3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <h1 class="brand">Caddygate</h1>
    <p class="brand-ja">キャディゲート</p>
    <p class="message">
      サイトリニューアル準備中です。<br />
      ローンチ情報は追ってご案内いたします。
    </p>
    <div class="meta">
      <p><strong>運営</strong>　株式会社KAIROS</p>
      <p>&copy; 2026 KAIROS Inc.</p>
    </div>
  </main>
</body>
</html>
