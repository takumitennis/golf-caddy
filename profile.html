<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>プロフィール登録 | Caddygate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- LP framework を先に、dashboard を後に -->
  <link rel="stylesheet" href="/design-system/framework.css?v=2">
  <link rel="stylesheet" href="/design-system/dashboard-framework.css?v=2">

  <style>
    /* ── profile ページ固有レイアウト ── */
    .prof-wrap {
      background: var(--color-bg);
      min-height: 100vh;
      padding: var(--space-6) var(--space-5);
    }
    .prof-container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ── ページヘッダー（gradient 排除、フラット化） ── */
    .prof-header {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5) var(--space-6);
      margin-bottom: var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-5);
    }
    .prof-header__brand {
      font-size: 1.125rem;          /* 18px */
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.015em;
      line-height: 1.2;
      flex-shrink: 0;
    }
    .prof-header__brand img {
      height: 28px;
      width: auto;
      display: block;
    }
    .prof-header__divider {
      width: 1px;
      height: 32px;
      background: var(--color-border);
      flex-shrink: 0;
    }
    .prof-header__title-wrap {}
    .prof-header__title {
      margin: 0;
      font-size: var(--fs-xlarge);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.3;
      color: var(--color-ink);
    }
    .prof-header__subtitle {
      margin: 4px 0 0;              /* Proximity: title 直下 */
      font-size: var(--fs-small);
      letter-spacing: 0.02em;
      line-height: 1.5;
      color: var(--color-ink-sub);
    }

    /* ── section カード ── */
    .prof-section {
      margin-bottom: var(--space-5);
    }
    .prof-section__title {
      font-size: var(--fs-nano);             /* 11px uppercase ラベル化 */
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.4;
      color: var(--color-ink-sub);
      margin: 0 0 var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--color-border);
    }

    /* ── stats grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      text-align: center;
    }
    .stat-number {
      font-size: var(--fs-xlarge);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-1);
    }
    .stat-label {
      font-size: var(--fs-small);
      color: var(--color-ink-sub);
    }

    /* ── golf courses list ── */
    .golf-courses-list {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .golf-course-item {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .golf-course-item:last-child {
      border-bottom: none;
    }
    .golf-course-name {
      font-weight: 600;
      color: var(--color-ink);
    }
    .golf-course-status {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-pill);
      font-size: var(--fs-micro);
      font-weight: 600;
      background: var(--color-primary-soft-bg);
      color: var(--color-primary-deep);
    }

    /* ── form 内セクション見出し ── */
    .form-section-title {
      font-size: var(--fs-small);
      font-weight: 700;
      color: var(--color-ink-sub);
      text-transform: uppercase;
      letter-spacing: var(--ls-wide);
      margin: var(--space-5) 0 var(--space-2);
      padding-bottom: var(--space-1);
      border-bottom: 1px solid var(--color-border);
    }

    /* ── back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--fs-small);
      color: var(--color-ink-sub);
      text-decoration: none;
      margin-bottom: var(--space-4);
    }
    .back-link:hover {
      color: var(--color-primary);
    }

    /* ── submit button width override ── */
    #profForm button[type="submit"] {
      width: 100%;
      margin-top: var(--space-5);
    }

    @media (max-width: 767px) {
      .prof-wrap { padding: var(--space-4) var(--space-3); }
      .prof-header { flex-direction: column; align-items: flex-start; gap: var(--space-2); }
      .prof-header__divider { display: none; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="prof-wrap">
    <div class="prof-container">

      <!-- ページヘッダー -->
      <header class="prof-header">
        <div class="prof-header__brand"><img src="/assets/logo-wordmark.png?v=3" alt="Caddygate" /></div>
        <div class="prof-header__divider"></div>
        <div class="prof-header__title-wrap">
          <h1 class="prof-header__title" id="title">プロフィール登録</h1>
          <p class="prof-header__subtitle">あなたの情報を登録して、サービスをご利用ください</p>
        </div>
      </header>

      <a href="/" class="back-link">← ホームに戻る</a>

      <!-- OAuth 認証情報の確認バナー（LINE / Google でログインした人向け） -->
      <div id="oauthBanner" class="card prof-section" style="display:none;padding:var(--space-4) var(--space-5);">
        <div style="display:flex;align-items:center;gap:var(--space-4);">
          <img id="oauthAvatar" alt="" style="display:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--color-border);object-fit:cover;" />
          <div style="flex:1;min-width:0;">
            <div style="font-size:var(--fs-micro);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-ink-mute);margin-bottom:4px;">
              <span id="oauthProvider">LINE</span> で認証済み
            </div>
            <div id="oauthName" style="font-size:var(--fs-body);font-weight:700;color:var(--color-ink);line-height:1.4;">—</div>
            <div id="oauthEmail" style="font-size:var(--fs-small);color:var(--color-ink-sub);line-height:1.4;margin-top:2px;"></div>
          </div>
        </div>
        <p style="margin:var(--space-3) 0 0;font-size:var(--fs-small);color:var(--color-ink-sub);line-height:1.6;">
          以下の情報は <span id="oauthProvider2">LINE</span> から取得した内容です。<br>必要に応じて編集してから登録してください。
        </p>

        <!-- LINE 連携ステータス（LINE Login ユーザーのみ） -->
        <div id="lineNotifyStatus" style="display:none;margin-top:var(--space-4);padding:var(--space-3) var(--space-4);background:var(--color-primary-soft-bg, #E8F2E8);border-radius:var(--radius-sm);">
          <div style="font-size:var(--fs-small);font-weight:700;color:var(--color-primary-deep);line-height:1.5;">
            ✓ LINE 通知が有効です
          </div>
          <div style="font-size:var(--fs-micro);color:var(--color-ink-sub);line-height:1.6;margin-top:4px;">
            マッチ成立・予約確定・シフト提出のリマインドなどが、自動でこの LINE アカウントに届きます。
          </div>
        </div>
      </div>

      <!-- プロフィール登録フォーム -->
      <div class="card prof-section">
        <h2 class="card__title prof-section__title">基本情報</h2>
        <form id="profForm"></form>
      </div>

      <!-- 統計情報（ログイン済みキャディのみ表示） -->
      <div id="statsSection" class="prof-section" style="display:none;">
        <div class="card">
          <h2 class="card__title prof-section__title">統計情報</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-number" id="roundsCount">0</div>
              <div class="stat-label">ラウンド回数</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="totalEarnings">¥0</div>
              <div class="stat-label">稼いだ合計金額</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 登録済みゴルフ場リスト（ゴルフ場ユーザーのみ表示） -->
      <div id="golfCoursesSection" class="prof-section" style="display:none;">
        <div class="card">
          <h2 class="card__title prof-section__title">登録済みゴルフ場</h2>
          <div id="golfCoursesList" class="golf-courses-list">
            <!-- ゴルフ場リストがここに表示されます -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
  (async () => {
  try {
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      alert("Supabase ライブラリの読み込みに失敗しました");
      throw new Error("supabase library not loaded");
    }
    /* ==== Supabase 初期化 ==== */
    const SUPABASE_URL  = "https://dfvxzwrqkxklfutlzqiq.supabase.co";
    const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdnh6d3Jxa3hrbGZ1dGx6cWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI4NzUsImV4cCI6MjA5NTgyODg3NX0.rRPwIqVfsdjGRkghv2X269oP75fOLm_w4Js16yWeh-Q";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ==== 役割判定（?role=golf or caddy）==== */
    /*   guest や不正値は caddy にフォールバック。
         URL から ?role=golf を期待するが、login 画面で role 未指定だった場合の保険。
         OAuth/LINE Login 直後は user_metadata.role を参照（URL に無いケース対応） */
    let role = new URLSearchParams(location.search).get("role");
    if (!role || (role !== "golf" && role !== "caddy")) {
      // URL 未指定 → user_metadata から拾う
      const { data: { user: u0 } } = await supabase.auth.getUser();
      if (u0 && u0.user_metadata && (u0.user_metadata.role === "golf" || u0.user_metadata.role === "caddy")) {
        role = u0.user_metadata.role;
      } else {
        console.warn("[profile] invalid role '" + role + "' → fallback to caddy");
        role = "caddy";
      }
    }

    const form  = document.getElementById("profForm");
    const title = document.getElementById("title");
    const statsSection = document.getElementById("statsSection");
    const golfCoursesSection = document.getElementById("golfCoursesSection");

    /* ==== ログインプロバイダの先読み ==== */
    const { data: { user: _provUser } } = await supabase.auth.getUser();
    const _provider = _provUser?.user_metadata?.provider || _provUser?.app_metadata?.provider || "";
    const isLineLoginUser = (_provider === "line");

    /* ==== 項目定義 ====
       LINE ID 欄は登録段階では一切聞かない（離脱抑止）。
       LINE 通知の有効化は dashboard サイドバーの「LINE通知」メニューから後追いで行う。
       既存 caddies.line_id カラムは触らず空のまま残置（後追いで更新可能）。 */
    const FIELDS = {
      golf: [
        {id:"name",                 label:"ゴルフ場名",                                     section:"基本情報"},
        {id:"contact_name",         label:"担当者名",                                       section:"基本情報"},
        {id:"phone",                label:"電話番号",                                       section:"基本情報"},
        {id:"caddy_wage_per_round", label:"キャディ謝礼金（1ラウンドあたり・円）", type:"number", section:"キャディ条件"},
        {id:"caddy_duration_hours", label:"拘束時間（時間）",                       type:"number", section:"キャディ条件"},
        {id:"perks",                label:"キャディ特典（例：打ちっぱなし無料）",            section:"キャディ条件"}
      ],
      caddy: [
        {id:"name",        label:"氏名"},
        {id:"phone",       label:"電話番号"},
        {id:"golf_years",  label:"ゴルフ歴(年)",  type:"number"},
        {id:"caddy_years", label:"キャディ歴(年)", type:"number"}
      ]
    };

    /* ==== 初期化 ====
       2026-06-01: 統計情報・登録済みゴルフ場リストはモックデータだったので削除。
       実データができたら caddy_dashboard.html 側で表示する。
       profile.html は登録/編集フォームに専念。 */
    async function initialize() {
      // 統計・ゴルフ場リストの読み込みは停止（モックデータ排除）
    }

    /* ==== 1. フォーム描画 ==== */
    title.textContent = role === "golf" ? "ゴルフ場プロフィール登録" : "キャディプロフィール登録";
    let currentSection = null;
    FIELDS[role].forEach(f => {
      if (f.section && f.section !== currentSection) {
        form.insertAdjacentHTML("beforeend",
          `<h3 class="form-section-title">${f.section}</h3>`);
        if (f.section === "キャディ条件") {
          form.insertAdjacentHTML("beforeend",
            `<p style="margin:0 0 var(--space-3);font-size:var(--fs-small);color:var(--color-ink-mute);">※ キャディ条件は後で編集可能です。</p>`);
        }
        currentSection = f.section;
      }
      const required = (f.section === "キャディ条件") ? "" : "required";
      form.insertAdjacentHTML("beforeend",
        `<div class="form-field">
           <label class="form-label" for="${f.id}">${f.label}</label>
           <input class="form-input" id="${f.id}" type="${f.type||'text'}" ${required} />
         </div>`);
    });
    form.insertAdjacentHTML("beforeend",
      `<button type="submit" class="btn btn--primary">登録</button>`);

    /* ==== 1-b. OAuth 取得情報のプリフィル ====
       LINE Login → user_metadata.name / picture / line_user_id（emailは合成値 line_xxx@caddygate.local）
       Google OAuth → user_metadata.full_name or name / avatar_url / picture / email は実アドレス
       メール+パスワード → 何も入っていないので skip */
    try {
      const { data: { user: oauthUser } } = await supabase.auth.getUser();
      if (oauthUser) {
        const meta = oauthUser.user_metadata || {};
        const appMeta = oauthUser.app_metadata || {};
        const provider = meta.provider || appMeta.provider || ""; // "line" | "google" | "email" | ""
        const isLine = provider === "line";
        const isGoogle = provider === "google";

        // OAuth 由来でない場合は banner を出さない
        if (isLine || isGoogle) {
          const oauthName = meta.full_name || meta.name || "";
          const oauthEmail = isLine ? "" : (oauthUser.email || ""); // LINEは合成 email なので表示しない
          const oauthPicture = meta.avatar_url || meta.picture || "";
          const providerLabel = isLine ? "LINE" : "Google";

          // banner 表示
          const banner = document.getElementById("oauthBanner");
          document.getElementById("oauthProvider").textContent = providerLabel;
          document.getElementById("oauthProvider2").textContent = providerLabel;
          document.getElementById("oauthName").textContent = oauthName || "(取得できませんでした)";
          const emailEl = document.getElementById("oauthEmail");
          if (oauthEmail) emailEl.textContent = oauthEmail;
          else emailEl.style.display = "none";
          if (oauthPicture) {
            const av = document.getElementById("oauthAvatar");
            av.src = oauthPicture;
            av.style.display = "block";
          }
          banner.style.display = "block";

          // LINE Login ユーザーには「LINE 通知有効」ステータスを追加表示
          if (isLine) {
            const statusEl = document.getElementById("lineNotifyStatus");
            if (statusEl) statusEl.style.display = "block";
          }

          // フォーム入力欄へプリフィル
          const setIfEmpty = (id, value) => {
            const el = document.getElementById(id);
            if (el && !el.value && value) el.value = value;
          };
          if (role === "caddy") {
            setIfEmpty("name", oauthName);
          } else if (role === "golf") {
            // ゴルフ場名は別物なので OAuth name は contact_name に入れる
            setIfEmpty("contact_name", oauthName);
          }
        }
      }
    } catch (e) {
      console.warn("[profile] OAuth prefill failed:", e);
    }

    /* ==== 2. 送信処理 ==== */
    form.onsubmit = async e => {
      e.preventDefault();

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { alert("未ログインです"); location.href="/"; return; }

      /* 入力値をオブジェクト化 */
      const data = Object.fromEntries(
        FIELDS[role].map(f => [f.id, document.getElementById(f.id).value])
      );
      data.email = user.email;

      /* 主キーを自動発行（g123456 / c123456） */
      if (role === "golf")  data.gid = "g" + user.id.slice(0,6);
      if (role === "caddy") data.cid = "c" + user.id.slice(0,6);

      /* テーブル INSERT */
      const table = role === "golf" ? "golf_courses" : "caddies";
      const { error } = await supabase.from(table).upsert(data, { onConflict: role === 'golf' ? 'gid' : 'cid' });
      if (error) { alert(error.message); return; }

      /* LINE Login 経由の caddy なら line_integrations の暫定 cid (auth_*) を正規 cid に書き換える */
      if (role === "caddy" && user.user_metadata && user.user_metadata.provider === "line" && user.user_metadata.line_user_id) {
        try {
          const tempCid = "auth_" + user.id.slice(0, 8);
          await supabase
            .from("line_integrations")
            .update({ cid: data.cid })
            .eq("cid", tempCid);
        } catch (e) {
          console.warn("[profile] line_integrations cid migration failed:", e);
        }
      }

      alert("登録完了！");
      // 絶対パスでダッシュボードハブへ
      location.href = "/dashboard.html";
    };

    /* ==== 3. ユーザー統計情報の読み込み ==== */
    async function loadUserStats() {
      try {
        // モックデータを使用（実際のAPIに置き換え可能）
        const mockStats = {
          roundsCount: 15,
          totalEarnings: 45000
        };

        document.getElementById('roundsCount').textContent = mockStats.roundsCount;
        document.getElementById('totalEarnings').textContent = `¥${mockStats.totalEarnings.toLocaleString()}`;

        statsSection.style.display = 'block';

      } catch (error) {
        console.error('Error loading user stats:', error);
      }
    }

    /* ==== 4. 登録済みゴルフ場の読み込み ==== */
    async function loadGolfCourses() {
      try {
        // モックデータを使用（実際のAPIに置き換え可能）
        const mockGolfCourses = [
          {
            id: 'g001',
            name: '○○ゴルフ場',
            status: 'アクティブ',
            registeredDate: '2025-01-15'
          },
          {
            id: 'g002',
            name: '△△ゴルフクラブ',
            status: 'アクティブ',
            registeredDate: '2025-03-20'
          }
        ];

        renderGolfCoursesList(mockGolfCourses);
        golfCoursesSection.style.display = 'block';

      } catch (error) {
        console.error('Error loading golf courses:', error);
      }
    }

    /* ==== 5. ゴルフ場リストの表示 ==== */
    function renderGolfCoursesList(golfCourses) {
      const golfCoursesList = document.getElementById('golfCoursesList');

      if (!golfCourses || golfCourses.length === 0) {
        golfCoursesList.innerHTML = `<div class="empty"><div class="empty__title">登録済みのゴルフ場はありません</div></div>`;
        return;
      }

      let html = '';
      golfCourses.forEach(course => {
        html += `
          <div class="golf-course-item">
            <div>
              <div class="golf-course-name">${course.name}</div>
              <small style="color:var(--color-ink-mute);font-size:var(--fs-micro);">登録日: ${course.registeredDate}</small>
            </div>
            <span class="golf-course-status">${course.status}</span>
          </div>
        `;
      });

      golfCoursesList.innerHTML = html;
    }

    // 初期化を実行
    initialize();
    document.title = "プロフィール ✓";
    console.log("[profile] initialized. role=", role);
  } catch (initError) {
    alert("プロフィール画面の初期化に失敗:\n" + (initError && initError.message ? initError.message : initError));
    console.error("[profile] init error:", initError);
  }
  })();
  </script>
</body>
</html>
