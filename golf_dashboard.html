<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5" />
  <title>ゴルフ場マイページ | Caddygate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- LP framework を先に、dashboard を後に -->
  <link rel="stylesheet" href="/design-system/framework.css?v=2">
  <link rel="stylesheet" href="/design-system/dashboard-framework.css?v=2">

  <style>
    /* ── 既存 JS が依存する hidden ユーティリティを維持 ── */
    .hidden { display: none !important; }

    /* ── calendar override: JS が .cal-green/.cal-red を動的に付与するため互換維持 ── */
    .cal-green { background: var(--color-primary-soft-bg); }
    .cal-yellow { background: var(--color-warn-soft); }
    .cal-red    { background: var(--color-gray-soft); }

    /* ── training-cal で JS が td.style.backgroundColor を直接書く箇所の補正 ── */
    #trainingCalTable td { transition: background var(--t-fast); }

    /* ── reserveBar は既存 JS が style.display を直接操作 ── */
    #reserveBar {
      position: fixed;
      left: var(--space-4);
      right: var(--space-4);
      bottom: var(--space-4);
      display: none;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      z-index: var(--z-drawer);
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    #reserveBar .reserve-info { color: var(--color-ink); font-size: var(--fs-body); }
    #reserveBar .reserve-actions { display: flex; gap: var(--space-2); }

    /* ── chat bubble 互換（JS が .sent/.received を使う） ── */
    .chat-bubble.sent  { background: var(--color-primary-soft-bg); align-self: flex-end; border-bottom-right-radius: var(--radius-sm); }
    .chat-bubble.received { background: var(--color-surface); align-self: flex-start; border: 1px solid var(--color-border); border-bottom-left-radius: var(--radius-sm); }
    .chat-meta.received { text-align: left; }

    /* ── training modal は既存 JS が style.display='flex' で開く ── */
    #trainingSlotsModal,
    #newMessageModal,
    #descriptionModal,
    #profileEditModal {
      position: fixed;
      inset: 0;
      background: rgba(26,26,26,0.4);
      align-items: center;
      justify-content: center;
      z-index: var(--z-modal, 1000);
    }
    .modal-inner {
      background: var(--color-surface);
      padding: var(--space-5);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 440px;
    }
    .modal-inner h3 {
      margin: 0 0 var(--space-4);
      font-size: var(--fs-h3);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.3;
      color: var(--color-ink);
    }
    .modal-footer { margin-top: var(--space-5); text-align: right; display: flex; gap: var(--space-2); justify-content: flex-end; }

    /* ── avail-count リンク style ── */
    .avail-count { color: var(--color-primary); font-weight: 600; cursor: pointer; }

    /* ── training request item ── */
    .training-request-item {
      border: 1px solid var(--color-border);
      margin-bottom: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      cursor: pointer;
    }
    .training-request-item:hover { background: var(--color-bg); }
    .request-detail { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-border); }

    /* ── calendar table override for dash-table context ── */
    .calendar, .calendar th, .calendar td {
      border-color: var(--color-border);
    }
    .calendar th {
      background: var(--color-surface-alt);
      color: var(--color-ink-sub);
      font-size: var(--fs-nano);              /* 11px */
      font-weight: 700;
      letter-spacing: 0.12em;                  /* 曜日を品格広げ */
      padding: var(--space-3) var(--space-2);
      text-align: center;
      line-height: 1;
    }
    .calendar td {
      padding: var(--space-2);
      text-align: center;
      height: 64px;                            /* 56→64: クリック領域に余韻 */
      vertical-align: middle;
      border: 1px solid var(--color-border);
    }

    /* ── 研修月別タブ ── */
    .sub-tabs-nav {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .sub-tabs-nav button {
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: var(--fs-small);
      font-weight: 500;
      cursor: pointer;
      color: var(--color-ink-sub);
      line-height: 1.4;
    }
    .sub-tabs-nav button:hover { background: var(--color-bg); color: var(--color-ink); }
    .sub-tabs-nav span {
      font-size: 1.0625rem;                   /* 17px 月名 */
      font-weight: 700;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--color-ink);
      padding: 0 var(--space-2);
    }

    /* ── trProfile / trMessage ボタン ── */
    .trProfile, .trMessage {
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: var(--fs-micro);
      font-weight: 600;
      background: transparent;
      cursor: pointer;
      color: var(--color-ink-sub);
    }
    .trProfile:hover, .trMessage:hover { background: var(--color-bg); color: var(--color-ink); }

    /* ── status badge inline ── */
    .status-pending   { color: var(--color-warn-deep); }
    .status-confirmed { color: var(--color-primary); }
    .status-completed { color: var(--color-info-deep, #6B5630); }
    .status-cancelled { color: var(--color-ink-mute); }

    /* ── profile image container ── */
    #profileImageContainer {
      width: 200px; height: 200px;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg);
      position: relative; overflow: hidden;
    }

    /* ── profile display layout ── */
    .profile-layout { display: flex; gap: var(--space-5); margin-bottom: var(--space-5); }
    .profile-layout__left { flex-shrink: 0; }
    .profile-layout__right { flex: 1; }

    /* ── inline message area (研修タブ用) ── */
    #inlineMessageArea .chat-shell { height: 280px; max-height: 280px; }

    /* ── mobile bottom nav safe padding ── */
    @media (max-width: 767px) {
      #reserveBar { bottom: calc(var(--dash-bottom-nav-h) + var(--space-3)); }
    }
  </style>
</head>
<body>
  <div class="dash-shell">

    <!-- 1. Desktop Sidebar -->
    <aside class="dash-sidebar">
      <a href="/" class="dash-sidebar__brand" aria-label="Caddygate ホーム">
        <img src="/assets/logo-wordmark.png?v=3" alt="Caddygate" />
      </a>

      <div class="dash-sidebar__group">
        <div class="dash-sidebar__group-label">メニュー</div>
        <button class="dash-nav-item" id="sideNavProf" onclick="switchMain('prof')">
          <i data-lucide="user" class="dash-nav-item__icon"></i>
          プロフィール
        </button>
        <button class="dash-nav-item is-active" id="sideNavSearch" onclick="switchMain('search')">
          <i data-lucide="search" class="dash-nav-item__icon"></i>
          キャディを探す
        </button>
        <button class="dash-nav-item" id="sideNavReservations" onclick="switchMain('reservations')">
          <i data-lucide="calendar-check" class="dash-nav-item__icon"></i>
          予約状況
        </button>
        <button class="dash-nav-item" id="sideNavTraining" onclick="switchMain('training')">
          <i data-lucide="graduation-cap" class="dash-nav-item__icon"></i>
          研修管理
        </button>
      </div>

      <div class="dash-sidebar__footer">
        <div class="dash-header__user" id="welcome"></div>
        <a class="btn--ghost" href="/password.html" style="text-align:center;text-decoration:none;display:block;">
          パスワード変更
        </a>
        <button id="logoutBtn" class="btn--ghost">
          ログアウト
        </button>
      </div>
    </aside>

    <!-- 2. Main -->
    <main class="dash-main">
      <header class="dash-header">
        <h1 class="dash-header__title" id="mainHeaderTitle">予約管理</h1>
        <div class="dash-header__actions">
          <!-- mobile: welcome -->
          <span class="dash-header__user show-mobile" id="welcomeMobile"></span>
        </div>
      </header>

      <!-- ====== SECTION: プロフィール ====== -->
      <div id="mainProfile" class="hidden" style="margin-top:var(--space-4);">
        <nav class="dash-tabs" role="tablist" aria-label="プロフィールタブ">
          <button id="btnProfBasic" class="dash-tab is-active" role="tab" aria-selected="true" onclick="switchSubTab('prof','basic')">基本情報</button>
          <button id="btnProfPayment" class="dash-tab" role="tab" aria-selected="false" onclick="switchSubTab('prof','payment')">支払い情報</button>
        </nav>
        <div id="subProfBasic" class="dash-section"></div>
        <div id="subProfPayment" class="hidden dash-section">
          <div class="dash-section__head">
            <h2 class="dash-section__title">Caddygate からの月末請求</h2>
          </div>
          <table class="dash-table" style="width:100%;">
            <thead>
              <tr>
                <th>年月</th>
                <th class="col-num">利用件数</th>
                <th class="col-num">請求額</th>
                <th>ステータス</th>
              </tr>
            </thead>
            <tbody id="paymentBody">
              <tr><td colspan="4" style="padding:0;border:0;">
                <div class="empty">
                  <i data-lucide="file-text" class="empty__icon"></i>
                  <div class="empty__title">データ準備中です</div>
                  <div class="empty__desc">月末請求の集計が完了次第、ここに表示されます。</div>
                </div>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ====== SECTION: キャディを探す ====== -->
      <div id="mainSearch">
        <!-- KPI Strip -->
        <section class="kpi-strip" id="statsSection">
          <article class="kpi-card">
            <div class="kpi-card__label">今週の予約</div>
            <div class="kpi-card__value" id="kpiThisWeek">—<span class="kpi-card__unit">件</span></div>
          </article>
          <article class="kpi-card">
            <div class="kpi-card__label">来週の予約</div>
            <div class="kpi-card__value" id="kpiNextWeek">—<span class="kpi-card__unit">件</span></div>
          </article>
          <article class="kpi-card">
            <div class="kpi-card__label">待機キャディ</div>
            <div class="kpi-card__value" id="kpiCaddies">—<span class="kpi-card__unit">名</span></div>
          </article>
          <article class="kpi-card">
            <div class="kpi-card__label">研修希望者</div>
            <div class="kpi-card__value" id="kpiTraining">—<span class="kpi-card__unit">名</span></div>
          </article>
        </section>

        <!-- Sub Tabs（underline型） -->
        <nav class="dash-tabs" role="tablist" aria-label="キャディを探すタブ">
          <button id="btnTab1" class="dash-tab is-active" role="tab" aria-selected="true">空き日付から</button>
          <button id="btnTabCaddy" class="dash-tab" role="tab" aria-selected="false">キャディから</button>
        </nav>

        <!-- Sub: 空き日付から（旧 tab2） -->
        <div id="tab2" class="hidden dash-section">
          <div class="sub-tabs-nav">
            <button id="prevMonth">◀</button>
            <span id="calTitle"></span>
            <button id="nextMonth">▶</button>
          </div>
          <div class="cal-shell">
            <table class="calendar cal-grid" id="calTable" style="border-collapse:separate;border-spacing:0;width:100%"></table>
            <div class="cal-legend">
              <span class="cal-legend__item">
                <span class="cal-legend__swatch" style="background:var(--color-gray-soft)"></span> × キャディなし
              </span>
              <span class="cal-legend__item">
                <span class="cal-legend__swatch" style="background:var(--color-surface)"></span> ○ 空きあり（クリックで予約）
              </span>
            </div>
          </div>
        </div>

        <!-- Sub: キャディから（新規） -->
        <div id="tabCaddy" class="hidden dash-section">
          <div class="dash-section__head">
            <h2 class="dash-section__title">登録キャディ一覧</h2>
            <div class="dash-section__actions">
              <button id="caddyListReload" class="btn--ghost">再読み込み</button>
            </div>
          </div>
          <div id="caddyGrid" class="dash-grid-2"></div>
        </div>
      </div>

      <!-- ====== SECTION: 予約状況 ====== -->
      <div id="mainReservations" class="hidden">
        <nav class="dash-tabs" role="tablist" aria-label="予約状況タブ">
          <button id="btnResvPending" class="dash-tab is-active" role="tab" aria-selected="true" onclick="switchSubTab('reservations','pending')">未確定の応募</button>
          <button id="btnResvConfirmed" class="dash-tab" role="tab" aria-selected="false" onclick="switchSubTab('reservations','confirmed')">確定済み</button>
        </nav>

        <!-- Sub: 未確定の応募（pending） -->
        <div id="subResvPending" class="dash-section">
          <div class="dash-section__head">
            <h2 class="dash-section__title">確定待ちの応募</h2>
            <div class="dash-section__actions">
              <button id="resvPendingReload" class="btn--ghost">再読み込み</button>
            </div>
          </div>
          <div id="resvPendingList"></div>
        </div>

        <!-- Sub: 確定済み -->
        <div id="subResvConfirmed" class="hidden dash-section">
          <div id="tabConfirm" class="dash-section" style="padding:0;">
            <div class="sub-tabs-nav">
              <button id="confPrev">◀</button>
              <span id="confTitle"></span>
              <button id="confNext">▶</button>
              <button id="confReload" class="btn--ghost" style="margin-left:auto;">再読み込み</button>
            </div>
            <table class="dash-table" style="margin-top:var(--space-3);width:100%;">
              <thead>
                <tr>
                  <th>日付</th>
                  <th>確定キャディ数</th>
                  <th>参加キャディ</th>
                </tr>
              </thead>
              <tbody id="confirmBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ====== SECTION: 研修管理 ====== -->
      <div id="mainTraining" class="hidden">
        <nav class="dash-tabs" role="tablist" aria-label="研修管理タブ">
          <button id="btnTab3" class="dash-tab is-active" role="tab" aria-selected="true">募集日設定</button>
          <button id="btnTab4" class="dash-tab" role="tab" aria-selected="false">応募キャディ</button>
        </nav>

        <!-- Sub: 募集日設定（旧 tab3） -->
        <div id="tab3" class="dash-section">
          <div class="sub-tabs-nav">
            <button id="prevTrainingMonth">◀</button>
            <span id="trainingCalTitle"></span>
            <button id="nextTrainingMonth">▶</button>
          </div>
          <div class="cal-shell">
            <table class="calendar cal-grid" id="trainingCalTable" style="border-collapse:separate;border-spacing:0;width:100%"></table>
            <div class="cal-legend">
              <span class="cal-legend__item">
                <span class="cal-legend__swatch" style="background:var(--color-primary-soft-bg)"></span> 設定済み（クリックで解除）
              </span>
              <span class="cal-legend__item">
                <span class="cal-legend__swatch" style="background:var(--color-surface)"></span> 未設定（クリックで設定）
              </span>
            </div>
          </div>
        </div>

        <!-- Sub: 応募キャディ（旧 tab4） -->
        <div id="tab4" class="hidden dash-section">
          <div id="trainingRequestsList"></div>
        </div>
      </div>

      <!-- Messages Tab（hidden by default, JS が必要時に show） -->
      <div id="mainMessages" class="hidden">
        <div class="chat-shell">
          <div class="chat-list" id="messagesList"></div>
          <div class="chat-input-area" id="chatInputArea" style="display:none;">
            <input id="chatInput" type="text" class="chat-input" placeholder="メッセージを入力..." autocomplete="off" />
            <button id="sendChatBtn" class="btn btn--primary">送信</button>
          </div>
        </div>
      </div>
    </main>

    <!-- 3. Mobile Bottom Nav -->
    <nav class="dash-bottom-nav">
      <button class="dash-bottom-nav__item" id="mNavProf" onclick="switchMain('prof')">
        <i data-lucide="user"></i>
        プロフィール
      </button>
      <button class="dash-bottom-nav__item is-active" id="mNavSearch" onclick="switchMain('search')">
        <i data-lucide="search"></i>
        探す
      </button>
      <button class="dash-bottom-nav__item" id="mNavReservations" onclick="switchMain('reservations')">
        <i data-lucide="calendar-check"></i>
        予約
      </button>
      <button class="dash-bottom-nav__item" id="mNavTraining" onclick="switchMain('training')">
        <i data-lucide="graduation-cap"></i>
        研修
      </button>
    </nav>
  </div>

  <!-- 予約バー -->
  <div id="reserveBar">
    <div class="reserve-info"><span id="reserveDateText"></span></div>
    <div class="reserve-actions">
      <button id="reserveCancel" class="btn--ghost">キャンセル</button>
      <button id="reserveBtn" class="btn btn--primary">予約する</button>
    </div>
  </div>

  <!-- Training Slots Modal（JS が style.display='flex' で開く） -->
  <div id="trainingSlotsModal" style="display:none;">
    <div class="modal-inner">
      <h3>研修可能人数設定</h3>
      <p id="modalDateDisplay" style="color:var(--color-ink-sub);font-size:var(--fs-small);margin:0 0 var(--space-3);"></p>
      <div class="form-field">
        <label class="form-field__label" for="slotsInput">同時可能人数</label>
        <input type="number" id="slotsInput" class="form-input" min="1" max="10" value="1">
      </div>
      <div class="modal-footer">
        <button id="cancelSlotsModal" class="btn--ghost">キャンセル</button>
        <button id="saveSlotsModal" class="btn btn--primary">保存</button>
      </div>
    </div>
  </div>

  <!-- New Message Modal -->
  <div id="newMessageModal" style="display:none;">
    <div class="modal-inner">
      <h3>新規メッセージ</h3>
      <div class="form-field">
        <label class="form-field__label" for="messageReceiver">送信先</label>
        <select id="messageReceiver" class="form-select"></select>
      </div>
      <div class="form-field">
        <label class="form-field__label" for="messageSubject">件名</label>
        <input type="text" id="messageSubject" class="form-input">
      </div>
      <div class="form-field">
        <label class="form-field__label" for="messageContent">内容</label>
        <textarea id="messageContent" class="form-textarea" rows="5"></textarea>
      </div>
      <div class="modal-footer">
        <button id="cancelMessage" class="btn--ghost">キャンセル</button>
        <button id="sendMessage" class="btn btn--primary">送信</button>
      </div>
    </div>
  </div>

  <!-- Logout Confirm Modal -->
  <div class="modal-backdrop" id="logoutBackdrop" data-open="false">
    <div class="modal" role="dialog" aria-labelledby="logoutModalTitle">
      <h2 class="modal__title" id="logoutModalTitle">ログアウトしますか？</h2>
      <p class="modal__body">未保存の入力は保存されません。</p>
      <div class="modal__actions">
        <button class="btn--ghost" id="logoutCancel">キャンセル</button>
        <button class="btn btn--primary" id="logoutConfirm">ログアウト</button>
      </div>
    </div>
  </div>

  <!-- Toast stack -->
  <div class="toast-stack" id="toastStack"></div>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /*
    Required Supabase table:

    CREATE TABLE IF NOT EXISTS public.training_availability (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      gid TEXT NOT NULL,
      date DATE NOT NULL,
      max_slots INT DEFAULT 1,
      created_at TIMESTAMP DEFAULT NOW(),
      UNIQUE(gid, date)
    );

    ALTER TABLE public.training_availability ENABLE ROW LEVEL SECURITY;
    */
    const sb = window.supabase.createClient(
      "https://dfvxzwrqkxklfutlzqiq.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdnh6d3Jxa3hrbGZ1dGx6cWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI4NzUsImV4cCI6MjA5NTgyODg3NX0.rRPwIqVfsdjGRkghv2X269oP75fOLm_w4Js16yWeh-Q"
    );

    let gid = null;
    let currentGolfName = '';
    let hasProfile = false;
    let isInitialized = false;
    // Month/Year state must be initialized before any render* is called
    let calMonth = new Date().getMonth();
    let calYear = new Date().getFullYear();
    let trainingCalMonth = new Date().getMonth();
    let trainingCalYear = new Date().getFullYear();
    // Training requests list month
    let trMonth = new Date().getMonth();
    let trYear = new Date().getFullYear();
    // Inline chat mode flag for training (no booking_id)
    let inlineTrainingMode = false;
    let confMonth = new Date().getMonth();
    let confYear = new Date().getFullYear();

    // ── sidebar nav active state helper ──
    function setSideNavActive(mode) {
      document.querySelectorAll('.dash-nav-item').forEach(el => el.classList.remove('is-active'));
      document.querySelectorAll('.dash-bottom-nav__item').forEach(el => el.classList.remove('is-active'));
      const titleMap = {
        prof: 'プロフィール',
        search: 'キャディを探す',
        reservations: '予約状況',
        training: '研修管理'
      };
      const sideIdMap = {
        prof: 'sideNavProf',
        search: 'sideNavSearch',
        reservations: 'sideNavReservations',
        training: 'sideNavTraining'
      };
      const mobileIdMap = {

    async function saveTrainingAvailability() {
      console.log('saveTrainingAvailability called');
      console.log('gid:', gid);
      console.log('currentEditingDate:', currentEditingDate);

      // DOM要素の存在確認
      const slotsInputElement = document.getElementById('slotsInput');
      if (!slotsInputElement) {
        alert('エラー: 人数入力フィールドが見つかりません');
        return;
      }

      const maxSlots = parseInt(slotsInputElement.value);
      console.log('maxSlots:', maxSlots);

      // データ検証
      if (!gid) {
        alert('エラー: ゴルフ場情報が設定されていません。ページを再読み込みしてください。');
        return;
      }

      if (!currentEditingDate) {
        alert('エラー: 編集対象の日付が設定されていません');
        return;
      }

      if (!maxSlots || maxSlots < 1 || maxSlots > 10) {
        alert('有効な人数（1-10）を入力してください');
        return;
      }

      try {
        console.log('Inserting data:', { gid, date: currentEditingDate, max_slots: maxSlots });

        // Use a more robust approach with detailed error checking
        console.log('Attempting to save training availability...');

        // First check if the record exists
        const { data: existingData, error: checkError } = await sb
          .from('training_availability')
          .select('id')
          .eq('gid', gid)
          .eq('date', currentEditingDate)
          .maybeSingle();

        console.log('Existing record check:', { existingData, checkError });

        let result;
        if (checkError) {
          console.error('Error checking existing record:', checkError);
          throw new Error(`データベース接続エラー: ${checkError.message || checkError.toString()}`);
        }

        if (existingData) {
          // Record exists, update it
          console.log('Updating existing record...');
          result = await sb
            .from('training_availability')
            .update({ max_slots: maxSlots })
            .eq('gid', gid)
            .eq('date', currentEditingDate);
        } else {
          // Record doesn't exist, insert new one
          console.log('Inserting new record...');
          result = await sb
            .from('training_availability')
            .insert({ gid, date: currentEditingDate, max_slots: maxSlots });
        }

        const { data, error } = result;
        console.log('Final operation result:', { data, error });

        if (error) {
          console.error('Supabase error details:', {
            message: error.message,
            code: error.code,
            details: error.details,
            hint: error.hint,
            full: error
          });

          // Specific error handling with more details
          let errorMessage = 'Unknown database error';

          if (error.code === '42P01') {
            errorMessage = 'データベーステーブル "training_availability" が存在しません。管理者にお問い合わせください。';
          } else if (error.code === '23505') {
            errorMessage = 'この日付は既に設定されています。';
          } else if (error.code === '23503') {
            errorMessage = 'ゴルフ場IDが無効です。';
          } else if (error.code === '42501') {
            errorMessage = 'データベースへのアクセス権限がありません。RLSポリシーを確認してください。';
          } else if (error.message) {
            errorMessage = `データベースエラー: ${error.message}`;
          } else if (error.toString && typeof error.toString === 'function') {
            errorMessage = `エラー: ${error.toString()}`;
          }

          throw new Error(errorMessage);
        }

        console.log('Successfully saved training availability');
        document.getElementById('trainingSlotsModal').style.display = 'none';
        renderTrainingCal();
      } catch (error) {
        console.error('Full error object:', error);
        const errorMessage = error.message || error.toString() || 'Unknown error';
        alert('保存エラー: ' + errorMessage);
      }
    }

    // --- Calendar variables (initialized at top) ---

    async function renderCal(){
      const first = new Date(calYear,calMonth,1);
      const last  = new Date(calYear,calMonth+1,0);
      document.getElementById('calTitle').textContent = `${calYear}年 ${calMonth+1}月`;
      // fetch availability rows for month
      const { data, error } = await sb
        .from('caddy_availability')
        .select('date')
        .gte('date', first.toISOString().slice(0,10))
        .lte('date', last.toISOString().slice(0,10));
      const countMap = {};
      if(!error){
        data.forEach(r=>{countMap[r.date]=(countMap[r.date]||0)+1;});
      }
      // build calendar grid
      const table=document.getElementById('calTable');
      table.innerHTML='';
      const headerRow=document.createElement('tr');
      ['日','月','火','水','木','金','土'].forEach(d=>{
        const th=document.createElement('th');th.textContent=d;headerRow.appendChild(th);
      });
      table.appendChild(headerRow);
      let row=document.createElement('tr');
      const startWeekDay=first.getDay();
      for(let i=0;i<startWeekDay;i++){
        const emptyTd=document.createElement('td');
        emptyTd.className='cal-outside';
        row.appendChild(emptyTd);
      }
      for(let day=1;day<=last.getDate();day++){
        const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const td=document.createElement('td');
        const cnt=countMap[dateStr]||0;
        const labelHtml = cnt===0 ? '<span class="cal-mark"></span>' : `<span class="avail-count" data-date="${dateStr}" style="color:var(--color-primary);font-weight:600;font-size:var(--fs-small);">${cnt}人</span><span class="cal-mark"></span>`;
        if(cnt===0){td.className='cal-disabled';}
        else{td.className='cal-available';}
        td.innerHTML = `<span class="cal-date">${day}</span>${labelHtml}`;
        td.style.cursor = cnt===0 ? 'not-allowed' : 'pointer';
        row.appendChild(td);
        if((startWeekDay+day)%7===0){table.appendChild(row);row=document.createElement('tr');}
      }
      if(row.children.length) {
        while(row.children.length<7){
          const emptyTd=document.createElement('td');
          emptyTd.className='cal-outside';
          row.appendChild(emptyTd);
        }
        table.appendChild(row);
      }
    }

    function switchSubTab(section, subKey) {
      if (section === 'prof') {

    async function renderCaddyDetailCal() {
      const caddy = caddyCalState.caddy;
      if (!caddy) return;
      const y = caddyCalState.year, m = caddyCalState.month;
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const titleEl = document.getElementById('caddyCalTitle');
      if (titleEl) titleEl.textContent = `${y}年 ${m + 1}月`;
      const { data, error } = await sb
        .from('caddy_availability')
        .select('date')
        .eq('cid', caddy.cid)
        .gte('date', first.toISOString().slice(0, 10))
        .lte('date', last.toISOString().slice(0, 10));
      const availSet = new Set();
      if (!error && data) data.forEach(r => availSet.add(r.date));
      const table = document.getElementById('caddyDetailCalTable');
      if (!table) return;
      table.innerHTML = '';
      const headerRow = document.createElement('tr');
      ['日','月','火','水','木','金','土'].forEach(d => {
        const th = document.createElement('th'); th.textContent = d; headerRow.appendChild(th);
      });
      table.appendChild(headerRow);
      let row = document.createElement('tr');
      const startWeekDay = first.getDay();
      for (let i = 0; i < startWeekDay; i++) {
        const td = document.createElement('td'); td.className = 'cal-outside'; row.appendChild(td);
      }
      for (let day = 1; day <= last.getDate(); day++) {
        const dateStr = `${y}-${String(m + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const td = document.createElement('td');
        const isAvail = availSet.has(dateStr);
        td.className = isAvail ? 'cal-available' : 'cal-disabled';
        td.innerHTML = `<span class="cal-date">${day}</span><span class="cal-mark"></span>`;
        td.style.cursor = isAvail ? 'pointer' : 'not-allowed';
        if (isAvail) {
          td.onclick = () => {
            if (!confirm(`${dateStr} に ${caddy.name} を予約しますか？`)) return;
            reserveBookingForCaddy(dateStr, caddy.cid);
          };
        }
        row.appendChild(td);
        if ((startWeekDay + day) % 7 === 0) { table.appendChild(row); row = document.createElement('tr'); }
      }
      if (row.children.length) {
        while (row.children.length < 7) {
          const td = document.createElement('td'); td.className = 'cal-outside'; row.appendChild(td);
        }
        table.appendChild(row);
      }
    }

    // キャディ指定の予約（既存 reserveBooking のロジックを流用、キャディ固定版）
    // 直接予約パス：bookings='confirmed' + booking_caddies='confirmed' を即時セット
    async function reserveBookingForCaddy(dateStr, cid) {
      try {
        // bookings 存在確認 or 作成
        const { data: existing, error: exErr } = await sb
          .from('bookings')
          .select('booking_id')
          .eq('gid', gid)
          .eq('date', dateStr)
          .maybeSingle();
        if (exErr && exErr.code !== 'PGRST116') throw exErr;
        let bookingId;
        if (existing) {
          bookingId = existing.booking_id;
          // 直接予約パスは即 confirmed
          await sb.from('bookings').update({ status: 'confirmed' }).eq('booking_id', bookingId);
        }
        else {
          const { data: created, error: crErr } = await sb
            .from('bookings')
            .insert({ gid, date: dateStr, slots: 1, status: 'confirmed' })
            .select('booking_id')
            .single();
          if (crErr) throw crErr;
          bookingId = created.booking_id;
        }
        // booking_caddies 割当（直接予約は confirmed）
        const { error: bcErr } = await sb
          .from('booking_caddies')
          .insert({ booking_id: bookingId, cid, status: 'confirmed' });
        if (bcErr) throw bcErr;
        // 該当cidのその日を caddy_availability から削除
        const { error: delErr } = await sb
          .from('caddy_availability')
          .delete()
          .eq('cid', cid)
          .eq('date', dateStr);
        if (delErr) throw delErr;
        alert('予約が完了しました！');
        try { await sendLineNotification(cid, dateStr, '全日'); } catch (e) { console.warn(e); }
        // モーダルを閉じてリスト更新
        const backdrop = document.getElementById('caddyDetailBackdrop');
        if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
        await loadBookings();
        await renderCal();
      } catch (err) {
        console.error(err);
        alert('予約に失敗しました: ' + (err.message || JSON.stringify(err)));
      }
    }

    // 予約処理
    async function reserveBooking(dateStr){
      try{
        // 1) その日の空きキャディからランダムに1名抽出
        const { data: avails, error: aErr } = await sb
          .from('caddy_availability')
          .select('cid')
          .eq('date', dateStr);
        if(aErr) throw aErr;
        if(!avails || avails.length===0){ alert('この日は空きキャディがいません'); return; }
        const cidList = avails.map(a=> a.cid).filter(Boolean);
        const randomCid = cidList[Math.floor(Math.random()*cidList.length)];

        // 2) bookings 存在確認 or 作成（直接予約パスは即 confirmed）
        const { data: existing, error: exErr } = await sb
          .from('bookings')
          .select('booking_id')
          .eq('gid', gid)
          .eq('date', dateStr)
          .maybeSingle();
        if(exErr && exErr.code!=='PGRST116') throw exErr;
        let bookingId;
        if(existing){
          bookingId = existing.booking_id;
          await sb.from('bookings').update({ status: 'confirmed' }).eq('booking_id', bookingId);
        }
        else{
          const { data: created, error: crErr } = await sb
            .from('bookings')
            .insert({ gid, date: dateStr, slots: 1, status: 'confirmed' })
            .select('booking_id')
            .single();
          if(crErr) throw crErr;
          bookingId = created.booking_id;
        }

        // 3) booking_caddies に割当（直接予約は confirmed）
        const { error: bcErr } = await sb
          .from('booking_caddies')
          .insert({ booking_id: bookingId, cid: randomCid, status: 'confirmed' });
        if(bcErr) throw bcErr;

        // 4) caddy_availability から該当cidのその日を削除（キャディ側スケジュール反映）
        const { error: delErr } = await sb
          .from('caddy_availability')
          .delete()
          .eq('cid', randomCid)
          .eq('date', dateStr);
        if(delErr) throw delErr;

        alert('予約が完了しました！');

        // LINE通知を送信
        try {
          console.log('=== 予約完了時のLINE通知開始 ===');
          console.log('キャディID:', randomCid);
          console.log('予約日:', dateStr);
          console.log('時間: 未指定（全日予約）');

          // 時間が指定されていない場合は全日予約として処理
          await sendLineNotification(randomCid, dateStr, '全日');
          console.log('LINE通知送信完了');
        } catch (notificationError) {
          console.error('LINE通知送信エラー:', notificationError);
          console.error('エラー詳細:', notificationError.message);
          // 通知エラーでも予約は完了させる
        }

        // UI 更新
        await loadBookings();
        await renderCal();
      } catch(err){
        console.error(err);
        alert('予約に失敗しました: ' + (err.message || JSON.stringify(err)));
      }
    }

    // Training calendar rendering (monthly view for training_availability)
    async function renderTrainingCal(){
      if (!gid) { console.warn('gid is not set yet'); return; }

      const first = new Date(trainingCalYear, trainingCalMonth, 1);
      const last = new Date(trainingCalYear, trainingCalMonth + 1, 0);
      const titleEl = document.getElementById('trainingCalTitle');
      if (titleEl) titleEl.textContent = `${trainingCalYear}年 ${trainingCalMonth + 1}月`;

      // Fetch availability for this month
      const { data: availData, error } = await sb
        .from('training_availability')
        .select('date, max_slots')
        .eq('gid', gid)
        .gte('date', first.toISOString().slice(0,10))
        .lte('date', last.toISOString().slice(0,10));

      const availabilityMap = new Map();
      if (!error && availData) {
        availData.forEach(r => availabilityMap.set(r.date, r.max_slots || 1));
      }

      const table = document.getElementById('trainingCalTable');
      if (!table) return;
      table.innerHTML = '';

      const headerRow = document.createElement('tr');
      ['日','月','火','水','木','金','土'].forEach(d => {
        const th = document.createElement('th');
        th.textContent = d;
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      let row = document.createElement('tr');
      const startWeekDay = first.getDay();
      for (let i = 0; i < startWeekDay; i++) {
        const emptyTd = document.createElement('td');
        emptyTd.className = 'cal-outside';
        row.appendChild(emptyTd);
      }

      for (let day = 1; day <= last.getDate(); day++) {
        const dateStr = `${trainingCalYear}-${String(trainingCalMonth + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const td = document.createElement('td');
        const maxSlots = availabilityMap.get(dateStr);
        const isAvailable = maxSlots !== undefined;

        td.innerHTML = `<span class="cal-date">${day}</span>${isAvailable ? `<small style="display:block;font-size:10px;color:var(--color-primary-deep);">${maxSlots}人</small>` : ''}<span class="cal-mark"></span>`;
        td.className = isAvailable ? 'cal-confirmed' : 'cal-available';
        td.style.cursor = 'pointer';

        td.onclick = () => {
          if (!gid) { alert('ゴルフ場情報が読み込まれていません。ページを再読み込みしてください。'); return; }
          if (isAvailable) {
            if (confirm(`${dateStr} の研修可能日設定を削除しますか？`)) {
              removeTrainingAvailability(dateStr);
            }
          } else {
            showTrainingSlotsModal(dateStr);
          }
        };

        row.appendChild(td);
        if ((startWeekDay + day) % 7 === 0) {
          table.appendChild(row);
          row = document.createElement('tr');
        }
      }

      if (row.children.length) {
        while (row.children.length < 7) {
          const emptyTd = document.createElement('td');
          emptyTd.className = 'cal-outside';
          row.appendChild(emptyTd);
        }
        table.appendChild(row);
      }
    }

    window.toggleRequestDetail = function(requestId) {

    // Update training request status
    window.updateTrainingStatus = async (requestId, status) => {
      const { error } = await sb
        .from('training_requests')
        .update({ status, updated_at: new Date().toISOString() })
        .eq('id', requestId);

      if (error) {
        alert('ステータス更新に失敗しました: ' + error.message);
      } else {
        alert('ステータスを更新しました');

        // 承認の場合、キャディにメッセージを送信 + LINE 通知
        if (status === 'confirmed') {
          const request = await sb
            .from('training_requests')
            .select('cid, training_date')
            .eq('id', requestId)
            .single();

          if (request.data) {
            const caddy = await sb
              .from('caddies')
              .select('name')
              .eq('cid', request.data.cid)
              .single();

            if (caddy.data) {
              await sendMessageToCaddy(request.data.cid, caddy.data.name, request.data.training_date);
            }
            try {
              const venue = currentGolfName || 'ゴルフ場';
              await notifyCaddyByCid(
                request.data.cid,
                `【Caddygate】${venue} の研修 ${request.data.training_date} が確定しました`
              );
            } catch (e) { console.error('LINE notify (training confirm) error:', e); }
          }
        }

        loadTrainingRequests(); // Reload the list
      }
    };

    // Cancel a training request (golf course side)
    window.cancelTrainingRequest = async (requestId, trainingDate, cid) => {
      if (!confirm(`${trainingDate || '該当日'} の研修申込をキャンセルしますか？`)) return;
      try {
        const { error } = await sb
          .from('training_requests')
          .update({ status: 'cancelled', updated_at: new Date().toISOString() })
          .eq('id', requestId);
        if (error) throw error;
        // LINE 通知
        if (cid) {
          const venue = currentGolfName || 'ゴルフ場';
          try {
            await notifyCaddyByCid(
              cid,
              `【Caddygate】${venue} の研修 ${trainingDate || ''} がキャンセルされました`
            );
          } catch (e) { console.error('LINE notify (training cancel) error:', e); }
        }
        alert('研修申込をキャンセルしました');
        loadTrainingRequests();
      } catch (err) {
        console.error('Cancel training error:', err);
        alert('キャンセルに失敗しました: ' + (err.message || err));
      }
    };

    // Load messages
    async function loadMessages(type = 'inbox') {
      console.log('Loading messages for type:', type, 'gid:', gid);
      const messagesList = document.getElementById('messagesList');

      if (!messagesList) {
        console.error('messagesList element not found');
        return;
      }

      try {
        let query;
        if (type === 'inbox') {
          query = sb
          .from('messages')
          .select('*')
            .eq('receiver_type', 'golf_course')
            .eq('receiver_id', gid)
          .order('created_at', { ascending: false });
        } else {
          query = sb
            .from('messages')
            .select('*')
            .eq('sender_type', 'golf_course')
            .eq('sender_id', gid)
            .order('created_at', { ascending: false });
        }

        const { data: messages, error } = await query;

        if (error) {
          messagesList.innerHTML = `<p>エラー: ${error.message}</p>`;
          return;
        }

        if (!messages || messages.length === 0) {
          messagesList.innerHTML = '<div class="empty"><div class="empty__title">メッセージはありません</div></div>';
          return;
        }

        let html = '';
        messages.forEach(message => {
          const isUnread = type === 'inbox' && !message.is_read;
          html += `
            <div style="border:1px solid var(--color-border);margin-bottom:var(--space-2);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:${isUnread ? 'var(--color-bg)' : 'var(--color-surface)'};">

                <div>
                  <strong style="font-size:var(--fs-body);">${message.subject}</strong>
                  ${isUnread ? '<span class="badge badge--pending" style="margin-left:var(--space-2);">未読</span>' : ''}
                </div>
                <small style="color:var(--color-ink-mute);font-size:var(--fs-micro);">${message.created_at?.slice(0,16).replace('T', ' ')}</small>
              </div>
              <p style="margin:var(--space-2) 0 0;color:var(--color-ink-sub);font-size:var(--fs-small);">${message.content.substring(0, 100)}${message.content.length > 100 ? '...' : ''}</p>
            </div>
          `;
        });

        messagesList.innerHTML = html;
      } catch (error) {
        messagesList.innerHTML = `<p>エラー: ${error.message}</p>`;
      }
    }

      try {

          .from('messages')

            sender_id: gid,
            receiver_type: 'caddy',
            receiver_id: receiverId,
            subject: subject,
            content: content
          });

        if (error) {
          alert('メッセージ送信に失敗しました: ' + error.message);
        } else {
          alert('メッセージを送信しました');
          document.getElementById('newMessageModal').style.display = 'none';
          document.getElementById('messageSubject').value = '';
          document.getElementById('messageContent').value = '';
          loadMessages('sent');
        }
      } catch (error) {
        alert('メッセージ送信に失敗しました: ' + error.message);
      }
    }

    // Profile image upload handler
    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) { // 5MB limit
        alert('ファイルサイズは5MB以下にしてください');
        return;
      }

      try {
        // Upload to Supabase Storage
        const fileExt = file.name.split('.').pop();
        const fileName = `${gid}_${Date.now()}.${fileExt}`;

        const { data: uploadData, error: uploadError } = await sb.storage
          .from('golf-course-images')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        // Get public URL
        const { data: urlData } = sb.storage
          .from('golf-course-images')
          .getPublicUrl(fileName);

        // Update database
        const { error: updateError } = await sb
          .from('golf_courses')
          .update({ image_url: urlData.publicUrl })
          .eq('gid', gid);

        if (updateError) throw updateError;

        // Update UI
        const container = document.getElementById('profileImageContainer');
        container.innerHTML = `<img src="${urlData.publicUrl}" alt="ゴルフ場画像" style="width:100%;height:100%;object-fit:cover;">
                              <input type="file" id="imageUpload" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;">`;

        // Re-attach event listener
        document.getElementById('imageUpload').onchange = handleImageUpload;

        alert('画像をアップロードしました');
      } catch (error) {
        console.error('Image upload error:', error);
        alert('画像アップロードに失敗しました: ' + error.message);
      }
    }

    /* --- チャットUI --- */
    let chatPartnerId = null;

    let currentBookingId = null;

    async function loadChatMessages(isTraining = false) {
      const listEl = isTraining ? document.getElementById('inlineMessagesList') : document.getElementById('messagesList');
      if (!listEl) return;

      if (!currentBookingId || !chatPartnerId) {
        listEl.innerHTML = '<div class="empty"><div class="empty__title">メッセージを選択してください</div></div>';
        return;
      }

      const { data: msgs, error } = await sb
        .from('messages')
        .select('*')
        .or(`sender_id.eq.${gid},receiver_id.eq.${gid}`)
        .order('created_at', { ascending: true });

      if (error) { listEl.innerHTML = `<p>エラー: ${error.message}</p>`; return; }

      listEl.innerHTML = '';
      (msgs || []).forEach(m => {
        const isSent = m.sender_id === gid;
        const div = document.createElement('div');
        div.className = `chat-bubble ${isSent ? 'sent' : 'received'}`;
        div.innerHTML = `${m.content || m.subject}<div class="chat-meta ${isSent ? '' : 'received'}">${(m.created_at||'').slice(11,16)}</div>`;
        listEl.appendChild(div);
      });
      listEl.scrollTop = listEl.scrollHeight;

      if (!isTraining) {
        const chatInputArea = document.getElementById('chatInputArea');
        if (chatInputArea) chatInputArea.style.display = 'flex';
      }
    }

    async function sendChatMessage(isTraining = false) {
      const inputEl = isTraining ? document.getElementById('inlineChatInput') : document.getElementById('chatInput');
      if (!inputEl || !inputEl.value.trim()) return;
      const content = inputEl.value.trim();
      inputEl.value = '';

      const { error } = await sb.from('messages').insert({
        sender_type: 'golf_course',
        sender_id: gid,
        receiver_type: 'caddy',
        receiver_id: chatPartnerId,
        subject: '連絡',
        content
      });
      if (error) { alert('送信エラー: ' + error.message); return; }
      await loadChatMessages(isTraining);
    }

    // renderConfirm
    async function renderConfirm() {
      document.getElementById('confTitle').textContent = `${confYear}年 ${confMonth+1}月`;
      document.getElementById('confPrev').onclick = () => { if(--confMonth < 0){confMonth=11;confYear--;} renderConfirm(); };
      document.getElementById('confNext').onclick = () => { if(++confMonth > 11){confMonth=0;confYear++;} renderConfirm(); };
      document.getElementById('confReload').onclick = renderConfirm;

      const first = `${confYear}-${String(confMonth+1).padStart(2,'0')}-01`;
      const lastDate = new Date(confYear, confMonth+1, 0).getDate();
      const last = `${confYear}-${String(confMonth+1).padStart(2,'0')}-${String(lastDate).padStart(2,'0')}`;

      const { data: bookings, error } = await sb
        .from('bookings')
        .select('booking_id,date,status,booking_caddies(cid,caddies(name))')
        .eq('gid', gid)
        .gte('date', first)
        .lte('date', last)
        .order('date', { ascending: true });

      const tbody = document.getElementById('confirmBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (error) {
        tbody.innerHTML = `<tr><td colspan="3">エラー: ${error.message}</td></tr>`;
        return;
      }

      if (!bookings || bookings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--color-ink-mute);padding:var(--space-5);">予約はありません</td></tr>';
        return;
      }

      bookings.forEach(b => {
        const names = (b.booking_caddies||[]).map(bc => bc.caddies?.name || '—').join(', ') || '—';
        const statusText = b.status === 'pending' ? '仮予約' :
                           b.status === 'confirmed' ? '確定' :
                           b.status === 'completed' ? '完了' :
                           b.status === 'cancelled' ? '取消' : b.status;
        const badgeClass = b.status === 'pending' ? 'badge badge--pending' :
                           b.status === 'confirmed' ? 'badge badge--confirmed' :
                           b.status === 'completed' ? 'badge badge--completed' : 'badge badge--cancelled';
        const canCancel = b.status !== 'cancelled' && b.status !== 'completed';
        const cancelBtnHtml = canCancel
          ? `<button class="btn--ghost btn--sm bookingCancelBtn" data-booking-id="${b.booking_id}" data-date="${b.date}" style="margin-left:var(--space-2);">キャンセル</button>`
          : '';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${b.date}</td>
          <td>${(b.booking_caddies||[]).length}名</td>
          <td>${names} <span class="${badgeClass}" style="margin-left:var(--space-2);">${statusText}</span>${cancelBtnHtml}</td>
        `;
        tbody.appendChild(tr);
      });

      // キャンセルボタンのバインド
      Array.from(document.getElementsByClassName('bookingCancelBtn')).forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const bookingId = e.currentTarget.getAttribute('data-booking-id');
          const dateStr = e.currentTarget.getAttribute('data-date');
          if (!bookingId) return;
          if (!confirm(`${dateStr} の予約をキャンセルしますか？`)) return;
          try {
            // 1) 関連キャディ取得（LINE 通知用）
            const { data: bcs } = await sb
              .from('booking_caddies')
              .select('cid')
              .eq('booking_id', bookingId);
            // 2) bookings.status を cancelled に
            const { error: bErr } = await sb
              .from('bookings')
              .update({ status: 'cancelled' })
              .eq('booking_id', bookingId);
            if (bErr) throw bErr;
            // 3) booking_caddies も cancelled に
            const { error: bcErr } = await sb
              .from('booking_caddies')
              .update({ status: 'cancelled' })
              .eq('booking_id', bookingId);
            if (bcErr) console.error('booking_caddies update error:', bcErr);
            // 4) 関連キャディに LINE 通知
            const venue = currentGolfName || 'ゴルフ場';
            const msg = `【Caddygate】${venue} の ${dateStr} の予約がキャンセルされました`;
            for (const bc of (bcs||[])) {
              try { await notifyCaddyByCid(bc.cid, msg); } catch(e) { console.error('LINE notify (cancel) error:', e); }
            }
            alert('予約をキャンセルしました');
            await renderConfirm();
          } catch (err) {
            console.error('Cancel booking error:', err);
            alert('キャンセルに失敗しました: ' + (err.message || err));
          }
        };
      });
    }

    // ── 応募一覧（未確定 pending）の描画 ──
    async function renderPendingApplicants() {
      const host = document.getElementById('resvPendingList');
      if (!host) return;
      host.innerHTML = '<div style="text-align:center;color:var(--color-ink-mute);padding:var(--space-5);">読み込み中...</div>';
      if (!gid) {
        host.innerHTML = `
          <div class="empty">
            <i data-lucide="user-x" class="empty__icon"></i>
            <div class="empty__title">ゴルフ場情報の読み込み待ちです</div>
            <div class="empty__desc">プロフィール登録後に応募一覧が表示されます。</div>
          </div>`;
        if (window.lucide) lucide.createIcons();
        return;
      }
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      // 自分のゴルフ場の bookings × booking_caddies(pending) × caddies
      const { data, error } = await sb
        .from('booking_caddies')
        .select('booking_id, cid, status, created_at, bookings!inner(booking_id, gid, date, status, start_time), caddies(cid,name,university,golf_years,caddy_years,appeal,avatar_url,rating)')
        .eq('status', 'pending')
        .eq('bookings.gid', gid)
        .gte('bookings.date', todayStr);
      if (error) {
        host.innerHTML = `<p style="color:var(--color-accent);">エラー: ${error.message}</p>`;
        return;
      }
      const rows = (data||[]).filter(r => r.bookings && r.bookings.status !== 'cancelled');
      if (rows.length === 0) {
        host.innerHTML = `
          <div class="empty">
            <i data-lucide="inbox" class="empty__icon"></i>
            <div class="empty__title">未確定の応募はありません</div>
            <div class="empty__desc">キャディからの応募があるとここに表示されます。</div>
          </div>`;
        if (window.lucide) lucide.createIcons();
        return;
      }
      // booking ごとに group 化（同じ日付の複数応募者を 1 グループに）
      const groups = new Map(); // booking_id -> { date, start_time, applicants: [] }
      rows.forEach(r => {
        const bid = r.booking_id;
        if (!groups.has(bid)) {
          groups.set(bid, {
            booking_id: bid,
            date: r.bookings.date,
            start_time: r.bookings.start_time || null,
            applicants: []
          });
        }
        groups.get(bid).applicants.push(r);
      });
      const ordered = Array.from(groups.values()).sort((a,b) => a.date.localeCompare(b.date));
      host.innerHTML = '';
      ordered.forEach(g => {
        const box = document.createElement('div');
        box.className = 'card';
        box.style.padding = 'var(--space-4)';
        box.style.marginBottom = 'var(--space-3)';
        const stText = g.start_time ? String(g.start_time).slice(0,5) : '—';
        let html = `
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-3);">
            <div style="font-weight:700;font-size:var(--fs-h3);color:var(--color-ink);">${g.date}</div>
            <div style="font-size:var(--fs-small);color:var(--color-ink-sub);">開始 ${stText} ／ ${g.applicants.length}名応募</div>
          </div>
        `;
        g.applicants.forEach(a => {
          const c = a.caddies || {};
          const initial = (c.name || '?').slice(0, 1);
          const yearsText = [
            c.caddy_years != null ? `キャディ歴 ${c.caddy_years}年` : null,
            c.golf_years != null ? `ゴルフ歴 ${c.golf_years}年` : null
          ].filter(Boolean).join(' / ');
          const ratingText = c.rating != null ? `★ ${Number(c.rating).toFixed(1)}` : '';
          const appealShort = (c.appeal || '').slice(0, 80) + ((c.appeal || '').length > 80 ? '…' : '');
          const created = a.created_at ? new Date(a.created_at) : null;
          const createdText = created
            ? `${created.getFullYear()}/${String(created.getMonth()+1).padStart(2,'0')}/${String(created.getDate()).padStart(2,'0')} ${String(created.getHours()).padStart(2,'0')}:${String(created.getMinutes()).padStart(2,'0')}`
            : '—';
          html += `
            <div class="person-card" style="margin-top:var(--space-2);">
              <div class="person-card__avatar">
                ${c.avatar_url ? `<img src="${c.avatar_url}" alt="">` : initial}
              </div>
              <div class="person-card__info">
                <div class="person-card__name">${c.name || '—'}</div>
                <div class="person-card__meta">${c.university || ''}${c.university ? ' ／ ' : ''}${yearsText}${ratingText ? ' ／ ' + ratingText : ''}</div>
                ${appealShort ? `<div class="person-card__meta" style="margin-top:4px;">${appealShort}</div>` : ''}
                <div class="person-card__meta" style="margin-top:4px;font-size:var(--fs-micro);">応募日時: ${createdText}</div>
              </div>
              <div class="person-card__actions" style="display:flex;gap:var(--space-2);">
                <button class="btn btn--primary btn--sm pendingConfirmBtn"
                  data-booking-id="${g.booking_id}"
                  data-cid="${a.cid}"
                  data-date="${g.date}"
                  data-name="${(c.name||'').replace(/"/g,'&quot;')}">確定</button>
                <button class="btn--ghost btn--sm pendingRejectBtn"
                  data-booking-id="${g.booking_id}"
                  data-cid="${a.cid}"
                  data-date="${g.date}"
                  data-name="${(c.name||'').replace(/"/g,'&quot;')}">却下</button>
              </div>
            </div>
          `;
        });
        box.innerHTML = html;
        host.appendChild(box);
      });
      if (window.lucide) lucide.createIcons();
      // 確定ボタン
      Array.from(document.getElementsByClassName('pendingConfirmBtn')).forEach(btn => {
        btn.onclick = async (e) => {
          const bookingId = e.currentTarget.getAttribute('data-booking-id');
          const targetCid = e.currentTarget.getAttribute('data-cid');
          const dateStr = e.currentTarget.getAttribute('data-date');
          const cname = e.currentTarget.getAttribute('data-name');
          if (!bookingId || !targetCid) return;
          if (!confirm(`${cname || 'このキャディ'} さんを ${dateStr} に確定しますか？\n他の応募者は自動で却下されます。`)) return;
          try {
            // 1) 該当 booking_caddies を confirmed に
            const { error: cfErr } = await sb
              .from('booking_caddies')
              .update({ status: 'confirmed' })
              .eq('booking_id', bookingId)
              .eq('cid', targetCid);
            if (cfErr) throw cfErr;
            // 2) bookings.status を confirmed に
            const { error: bErr } = await sb
              .from('bookings')
              .update({ status: 'confirmed' })
              .eq('booking_id', bookingId);
            if (bErr) console.warn('bookings update:', bErr.message);
            // 3) 同 booking の他の pending を rejected に（旧 pending を保持しておく）
            const { data: others } = await sb
              .from('booking_caddies')
              .select('cid')
              .eq('booking_id', bookingId)
              .eq('status', 'pending');
            const rejectedCids = (others||[]).map(o => o.cid).filter(c => c && c !== targetCid);
            if (rejectedCids.length > 0) {
              const { error: rjErr } = await sb
                .from('booking_caddies')
                .update({ status: 'rejected' })
                .eq('booking_id', bookingId)
                .in('cid', rejectedCids);
              if (rjErr) console.warn('reject other applicants:', rjErr.message);
            }
            // 4) 確定キャディに LINE 通知
            try {
              await sendLineNotification(targetCid, dateStr, '');
            } catch (e) { console.error('LINE notify (confirm) error:', e); }
            // 5) 却下されたキャディに LINE 通知（やんわり）
            const venue = currentGolfName || 'ゴルフ場';
            const rejectMsg = `【Caddygate】${venue} の ${dateStr} の予約は別のキャディに決まりました。次回もよろしくお願いします。`;
            for (const rc of rejectedCids) {
              try { await notifyCaddyByCid(rc, rejectMsg); } catch (e) { console.error(e); }
            }
            alert('確定しました');
            await renderPendingApplicants();
          } catch (err) {
            console.error('Confirm applicant error:', err);
            alert('確定に失敗しました: ' + (err.message || err));
          }
        };
      });
      // 却下ボタン（その応募者のみ）
      Array.from(document.getElementsByClassName('pendingRejectBtn')).forEach(btn => {
        btn.onclick = async (e) => {
          const bookingId = e.currentTarget.getAttribute('data-booking-id');
          const targetCid = e.currentTarget.getAttribute('data-cid');
          const dateStr = e.currentTarget.getAttribute('data-date');
          const cname = e.currentTarget.getAttribute('data-name');
          if (!bookingId || !targetCid) return;
          if (!confirm(`${cname || 'このキャディ'} さんの ${dateStr} の応募を却下しますか？`)) return;
          try {
            const { error } = await sb
              .from('booking_caddies')
              .update({ status: 'rejected' })
              .eq('booking_id', bookingId)
              .eq('cid', targetCid);
            if (error) throw error;
            // 該当キャディに LINE 通知（やんわり）
            try {
              const venue = currentGolfName || 'ゴルフ場';
              await notifyCaddyByCid(
                targetCid,
                `【Caddygate】${venue} の ${dateStr} の応募は今回は見送らせていただきます。引き続きよろしくお願いします。`
              );
            } catch (e) { console.error('LINE notify (reject) error:', e); }
            alert('却下しました');
            await renderPendingApplicants();
          } catch (err) {
            console.error('Reject applicant error:', err);
            alert('却下に失敗しました: ' + (err.message || err));
          }
        };
      });
      const reloadBtn = document.getElementById('resvPendingReload');
      if (reloadBtn) reloadBtn.onclick = renderPendingApplicants;
    }

    // ── 支払い情報（ゴルフ場側） ──
    // 1) キャディへの支払い記録（月別、直接お渡し）
    // 2) Caddygate からの月末請求（仮）
    const SYSTEM_FEE_PER_BOOKING = 500; // 仮：1 件あたり 500 円
    async function loadGolfPayments() {
      const tbody = document.getElementById('paymentBody');
      if (!tbody) return;
      if (!gid) return;
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--color-ink-mute);padding:var(--space-5);">読み込み中...</td></tr>';
      const { data, error } = await sb
        .from('booking_caddies')
        .select('booking_id, status, bookings!inner(booking_id, gid, date, status, golf_courses(name, caddy_wage_per_round))')
        .in('status', ['confirmed','completed'])
        .eq('bookings.gid', gid);
      if (error) {
        tbody.innerHTML = `<tr><td colspan="4">エラー: ${error.message}</td></tr>`;
        return;
      }
      const rows = (data||[]).filter(r => r.bookings && r.bookings.status !== 'cancelled');

      // 月別集計
      const byMonth = new Map(); // ym -> { rounds, total }
      rows.forEach(r => {
        const ym = (r.bookings.date || '').slice(0,7);
        if (!ym) return;
        const wage = Number(r.bookings.golf_courses?.caddy_wage_per_round || 0);
        const cur = byMonth.get(ym) || { rounds: 0, total: 0 };
        cur.rounds += 1;
        cur.total += wage;
        byMonth.set(ym, cur);
      });

      // 描画先：subProfPayment 内に 2 つのテーブルを縦に並べる
      const paymentSection = document.getElementById('subProfPayment');
      if (!paymentSection) return;
      // 既存の table 要素を取り直し、上下に新セクションを差し込む
      // 既存 .dash-section__head は再利用、その後 2 テーブル
      paymentSection.innerHTML = `
        <div class="dash-section__head">
          <h2 class="dash-section__title">キャディへの支払い記録（月別・直接お渡し）</h2>
        </div>
        <table class="dash-table" style="width:100%;">
          <thead>
            <tr>
              <th>年月</th>
              <th class="col-num">利用キャディ件数</th>
              <th class="col-num">キャディへの支払い合計</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="caddyPayoutBody"></tbody>
        </table>

        <div class="dash-section__head" style="margin-top:var(--space-5);">
          <h2 class="dash-section__title">Caddygate からの月末請求（仮）</h2>
        </div>
        <table class="dash-table" style="width:100%;">
          <thead>
            <tr>
              <th>年月</th>
              <th class="col-num">利用件数</th>
              <th class="col-num">請求額</th>
              <th>ステータス</th>
            </tr>
          </thead>
          <tbody id="paymentBody"></tbody>
        </table>
      `;

      const payoutBody = document.getElementById('caddyPayoutBody');
      const feeBody = document.getElementById('paymentBody');

      if (byMonth.size === 0) {
        const emptyPayout = `<tr><td colspan="4" style="padding:0;border:0;">
          <div class="empty">
            <i data-lucide="hand-coins" class="empty__icon"></i>
            <div class="empty__title">キャディへの支払い記録はまだありません</div>
            <div class="empty__desc">確定したキャディの利用実績が月別にここに表示されます。</div>
          </div>
        </td></tr>`;
        const emptyFee = `<tr><td colspan="4" style="padding:0;border:0;">
          <div class="empty">
            <i data-lucide="file-text" class="empty__icon"></i>
            <div class="empty__title">月末請求のデータはまだありません</div>
            <div class="empty__desc">確定件数が発生次第、月末請求がここに集計されます。</div>
          </div>
        </td></tr>`;
        payoutBody.innerHTML = emptyPayout;
        feeBody.innerHTML = emptyFee;
        if (window.lucide) lucide.createIcons();
        return;
      }
      const months = Array.from(byMonth.keys()).sort().reverse();
      payoutBody.innerHTML = '';
      feeBody.innerHTML = '';
      months.forEach(ym => {
        const m = byMonth.get(ym);
        const label = ym.replace('-', '年') + '月';
        // payout
        const trA = document.createElement('tr');
        trA.innerHTML = `
          <td>${label}</td>
          <td class="col-num">${m.rounds}</td>
          <td class="col-num">¥${m.total.toLocaleString()}</td>
          <td><span style="font-size:var(--fs-small);color:var(--color-ink-sub);">当日キャディへ直接お渡し</span></td>
        `;
        payoutBody.appendChild(trA);
        // fee
        const fee = m.rounds * SYSTEM_FEE_PER_BOOKING;
        const trB = document.createElement('tr');
        trB.innerHTML = `
          <td>${label}</td>
          <td class="col-num">${m.rounds}</td>
          <td class="col-num">¥${fee.toLocaleString()}</td>
          <td><span class="badge badge--pending">集計中</span></td>
        `;
        feeBody.appendChild(trB);
      });
    }

    // ── LINE 通知ヘルパー ──
    // 任意の cid に対して LINE 通知を送る
    async function notifyCaddyByCid(cid, message) {
      if (!cid || !message) return { ok: false, reason: 'invalid' };
      try {
        const { data: integ } = await sb
          .from('line_integrations')
          .select('line_user_id')
          .eq('cid', cid)
          .eq('is_active', true)
          .maybeSingle();
        if (!integ?.line_user_id) return { ok: false, reason: 'not_linked' };
        const res = await fetch('/api/send-line-notification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineUserId: integ.line_user_id, message })
        });
        return { ok: res.ok };
      } catch (e) {
        console.error('LINE notify (caddy) error:', e);
        return { ok: false, reason: 'fetch_failed' };
      }
    }

    // 任意の gid に対して LINE 通知を送る
    async function notifyGolfByGid(gid, message) {
      if (!gid || !message) return { ok: false, reason: 'invalid' };
      try {
        const { data: integ } = await sb
          .from('line_integrations')
          .select('line_user_id')
          .eq('gid', gid)
          .eq('is_active', true)
          .maybeSingle();
        if (!integ?.line_user_id) return { ok: false, reason: 'not_linked' };
        const res = await fetch('/api/send-line-notification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineUserId: integ.line_user_id, message })
        });
        return { ok: res.ok };
      } catch (e) {
        console.error('LINE notify (golf) error:', e);
        return { ok: false, reason: 'fetch_failed' };
      }
    }

    // 旧 stub 互換ラッパ（cid + 日付指定で予約確定通知を送る）
    async function sendLineNotification(cid, date, time) {
      const venue = currentGolfName || 'ゴルフ場';
      const message = `【Caddygate】${venue} で ${date} の予約が確定しました`;
      return await notifyCaddyByCid(cid, message);
    }

    // init Lucide icons after DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
    if (document.readyState !== 'loading') {
      if (window.lucide) lucide.createIcons();
    }
  </script>
</body>
</html>
