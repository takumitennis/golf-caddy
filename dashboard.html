<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>マイページ | Caddygate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- LP framework を先に、dashboard を後に -->
  <link rel="stylesheet" href="/design-system/framework.css?v=2">
  <link rel="stylesheet" href="/design-system/dashboard-framework.css?v=2">

  <style>
    /* ロード中ハブ用レイアウト */
    .hub-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: var(--space-5);
      background: var(--color-bg);
    }
    .hub-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8) var(--space-7);   /* 縦 64 / 横 48 */
      text-align: center;
      min-width: 320px;
    }
    .hub-card__brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.015em;
      line-height: 1.2;
      margin-bottom: var(--space-4);
    }
    .hub-card__brand img {
      height: 32px;
      width: auto;
      display: inline-block;
    }
    .hub-card__status {
      font-size: var(--fs-small);
      color: var(--color-ink-sub);
      letter-spacing: 0.02em;
      line-height: 1.5;
      margin-bottom: var(--space-6);
    }

    /* 未登録者向け「登録しますか？」カード */
    .register-prompt { display: none; }
    .register-prompt.is-visible { display: block; }
    .register-prompt__title {
      font-size: var(--fs-large);
      font-weight: 700;
      color: var(--color-ink);
      margin-bottom: var(--space-3);
      letter-spacing: 0.02em;
    }
    .register-prompt__body {
      font-size: var(--fs-small);
      color: var(--color-ink-sub);
      line-height: 1.6;
      margin-bottom: var(--space-5);
    }
    .register-prompt__provider {
      font-weight: 700;
      color: var(--color-ink);
    }
    .register-prompt__actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .register-prompt__actions .btn { width: 100%; }
  </style>
</head>
<body>
  <div class="hub-wrap">
    <div class="hub-card">
      <div class="hub-card__brand"><img src="/assets/logo-wordmark.png?v=3" alt="Caddygate" /></div>

      <!-- 通常ロード中 / ステータス表示 -->
      <div id="loadingView">
        <div class="hub-card__status" id="welcome">読み込み中…</div>
        <button id="logout" class="btn--ghost">ログアウト</button>
      </div>

      <!-- 未登録者向け「登録しますか？」カード -->
      <div id="registerPrompt" class="register-prompt">
        <div class="register-prompt__title">まだ登録が完了していません</div>
        <div class="register-prompt__body">
          <span id="providerLabel" class="register-prompt__provider">LINE</span> での認証は通りましたが、
          <span id="roleLabel">キャディ</span>としてのプロフィール登録がまだ完了していません。<br>
          このまま<span id="roleLabel2">キャディ</span>として登録しますか？
        </div>
        <div class="register-prompt__actions">
          <button id="registerYes" class="btn btn--primary btn--lg">登録手続きを続ける</button>
          <button id="registerNo" class="btn--ghost">いいえ、別のアカウントでやり直す</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://dfvxzwrqkxklfutlzqiq.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdnh6d3Jxa3hrbGZ1dGx6cWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI4NzUsImV4cCI6MjA5NTgyODg3NX0.rRPwIqVfsdjGRkghv2X269oP75fOLm_w4Js16yWeh-Q"
    );

    // OAuth callback / メール認証 callback の場合、Supabase JS は
    // 自動で URL hash からセッションを復元する。
    // 復元が間に合わないケースに備えて onAuthStateChange でも捕捉する。

    let routed = false;
    const welcomeEl = document.getElementById("welcome");
    function setStatus(msg) {
      welcomeEl.textContent = msg;
      console.log("[dashboard]", msg);
    }

    // Promise を timeout 付きで await するヘルパー
    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(label + " が " + ms + "ms 以内に返ってきませんでした")), ms))
      ]);
    }

    async function routeUser(user) {
      if (routed) return;
      if (!user) return;
      setStatus("ステップ2: ユーザー判定中 (email=" + (user.email || "?") + ")");

      // URL クエリの role が user_metadata より優先される（OAuth callback で渡してくるケース）
      // OAuth プロバイダ側で query が落とされるケースに備え、sessionStorage を fallback として使う
      const urlRole = new URLSearchParams(location.search).get("role");
      let stashedRole = null;
      try { stashedRole = sessionStorage.getItem("oauth_role"); } catch (_) {}
      const incomingRole = urlRole || stashedRole;
      let role = user.user_metadata?.role;
      setStatus("ステップ3: role=" + (role || "なし") + " incoming=" + (incomingRole || "なし"));

      // user_metadata に role が無い OAuth ユーザー → URL/stash から拾う
      // updateUser はサーバ呼び出しで遅いので await しない（fire-and-forget でバックグラウンド書込み）。
      // ルーティング自体はメモリ上の role で進める。
      if (!role && (incomingRole === "golf" || incomingRole === "caddy")) {
        role = incomingRole;
        sb.auth.updateUser({ data: { role: incomingRole } })
          .then(() => console.log("[dashboard] role 書込み完了 (bg):", incomingRole))
          .catch((e) => console.warn("[dashboard] role 書込み失敗 (bg):", e?.message || e));
      }

      try { sessionStorage.removeItem("oauth_role"); } catch (_) {}

      if (role !== "golf" && role !== "caddy") {
        setStatus("エラー: role が確定できません → / に戻ります");
        setTimeout(() => { window.location.href = "/"; }, 2000);
        return;
      }

      // テーブル row が存在するかチェック（OAuth 初回ログインなら無いはず）
      const table = role === "golf" ? "golf_courses" : "caddies";
      setStatus("ステップ5: " + table + " テーブル検索中… (email=" + user.email + ")");
      let profile = null;
      let timeoutHit = false;
      try {
        // .maybeSingle() の特殊な Accept ヘッダーを避けるため limit(1) で受ける
        const res = await withTimeout(
          sb.from(table).select("email").eq("email", user.email).limit(1),
          25000,
          table + " query"
        );
        if (res.error) {
          setStatus("ステップ5: クエリエラー (" + res.error.message + ") → 未登録扱いで続行");
          profile = null;
        } else {
          profile = Array.isArray(res.data) && res.data.length > 0 ? res.data[0] : null;
        }
      } catch (e) {
        timeoutHit = true;
        setStatus("ステップ5: timeout 発生 (" + e.message + ") → 未登録扱いで登録確認画面へ");
      }

      routed = true;
      if (!profile) {
        // 未登録（または timeout で確認不能）→ 確認カードを表示
        if (!timeoutHit) setStatus("ステップ6: " + table + " に登録無し → 登録確認カード表示");
        showRegisterPrompt(role, user);
      } else {
        setStatus("ステップ6: 登録あり → " + (role === "golf" ? "/golf_dashboard.html" : "/caddy_dashboard.html") + " へ");
        if (role === "golf") {
          window.location.href = "/golf_dashboard.html";
        } else {
          window.location.href = "/caddy_dashboard.html";
        }
      }
    }

    function showRegisterPrompt(role, user) {
      const providerName = (user.user_metadata?.provider === "line") ? "LINE"
                         : (user.app_metadata?.provider === "google") ? "Google"
                         : (user.app_metadata?.provider === "line") ? "LINE"
                         : "メール";
      const roleName = role === "golf" ? "ゴルフ場" : "キャディ";

      document.getElementById("loadingView").style.display = "none";
      document.getElementById("providerLabel").textContent = providerName;
      document.getElementById("roleLabel").textContent = roleName;
      document.getElementById("roleLabel2").textContent = roleName;
      document.getElementById("registerPrompt").classList.add("is-visible");

      document.getElementById("registerYes").onclick = () => {
        window.location.href = `/profile.html?role=${role}`;
      };
      document.getElementById("registerNo").onclick = async () => {
        try {
          await sb.auth.signOut();
        } catch (_) {}
        window.location.href = "/login/?role=" + role;
      };
    }

    // OAuth / メール認証 callback も SIGNED_IN を発火するので拾う
    sb.auth.onAuthStateChange(async (event, session) => {
      console.log("[dashboard] authState:", event);
      if (event === "SIGNED_IN" && session?.user) {
        setStatus("認証イベント SIGNED_IN を受信、ルーティング開始");
        await routeUser(session.user);
      }
    });

    // 初期チェック（既にセッションがある場合）
    // getSession() は localStorage から即時復元するためサーバ呼び出し不要。
    // getUser() を使うとサーバの /auth/v1/user を叩くため、ネットワーク不安定時にタイムアウトする。
    (async () => {
      setStatus("ステップ1: セッション復元中…");
      try {
        const { data: { session } } = await sb.auth.getSession();
        const user = session?.user || null;
        console.log("[dashboard] initial session:", session ? "あり" : "なし", "user:", user);

        if (!user) {
          setStatus("ステップ1: セッション無し、1.5秒待って onAuthStateChange に委譲");
          setTimeout(async () => {
            if (routed) return;
            const { data: { session: s2 } } = await sb.auth.getSession();
            const u2 = s2?.user || null;
            if (!u2) {
              setStatus("セッションが見つかりません → / に戻ります");
              setTimeout(() => { window.location.href = "/"; }, 2000);
            } else {
              await routeUser(u2);
            }
          }, 1500);
          return;
        }
        await routeUser(user);
      } catch (e) {
        console.error("[dashboard] fatal:", e);
        setStatus("致命的エラー: " + e.message);
      }
    })();

    // ログアウト処理
    document.getElementById("logout").onclick = async () => {
      await sb.auth.signOut();
      window.location.href = "/";
    };
  </script>
</body>
</html>
