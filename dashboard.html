<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>マイページ | Caddygate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- LP framework を先に、dashboard を後に -->
  <link rel="stylesheet" href="/design-system/framework.css?v=2">
  <link rel="stylesheet" href="/design-system/dashboard-framework.css?v=2">

  <style>
    /* ロード中ハブ用レイアウト */
    .hub-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: var(--space-5);
      background: var(--color-bg);
    }
    .hub-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8) var(--space-7);   /* 縦 64 / 横 48 */
      text-align: center;
      min-width: 320px;
    }
    .hub-card__brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.015em;
      line-height: 1.2;
      margin-bottom: var(--space-4);
    }
    .hub-card__brand img {
      height: 32px;
      width: auto;
      display: inline-block;
    }
    .hub-card__status {
      font-size: var(--fs-small);
      color: var(--color-ink-sub);
      letter-spacing: 0.02em;
      line-height: 1.5;
      margin-bottom: var(--space-6);
    }
  </style>
</head>
<body>
  <div class="hub-wrap">
    <div class="hub-card">
      <div class="hub-card__brand"><img src="/assets/logo-wordmark.png?v=3" alt="Caddygate" /></div>
      <div class="hub-card__status" id="welcome">読み込み中…</div>
      <button id="logout" class="btn--ghost">ログアウト</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://dfvxzwrqkxklfutlzqiq.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdnh6d3Jxa3hrbGZ1dGx6cWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI4NzUsImV4cCI6MjA5NTgyODg3NX0.rRPwIqVfsdjGRkghv2X269oP75fOLm_w4Js16yWeh-Q"
    );

    // OAuth callback / メール認証 callback の場合、Supabase JS は
    // 自動で URL hash からセッションを復元する。
    // 復元が間に合わないケースに備えて onAuthStateChange でも捕捉する。

    let routed = false;
    const welcomeEl = document.getElementById("welcome");
    function setStatus(msg) {
      welcomeEl.textContent = msg;
      console.log("[dashboard]", msg);
    }

    // Promise を timeout 付きで await するヘルパー
    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(label + " が " + ms + "ms 以内に返ってきませんでした")), ms))
      ]);
    }

    async function routeUser(user) {
      if (routed) return;
      if (!user) return;
      setStatus("ステップ2: ユーザー判定中 (email=" + (user.email || "?") + ")");

      // URL クエリの role が user_metadata より優先される（OAuth callback で渡してくるケース）
      // OAuth プロバイダ側で query が落とされるケースに備え、sessionStorage を fallback として使う
      const urlRole = new URLSearchParams(location.search).get("role");
      let stashedRole = null;
      try { stashedRole = sessionStorage.getItem("oauth_role"); } catch (_) {}
      const incomingRole = urlRole || stashedRole;
      let role = user.user_metadata?.role;
      setStatus("ステップ3: role=" + (role || "なし") + " incoming=" + (incomingRole || "なし"));

      // user_metadata に role が無い OAuth ユーザー → URL/stash から拾って Supabase に書く
      if (!role && (incomingRole === "golf" || incomingRole === "caddy")) {
        setStatus("ステップ4: updateUser で role 書込み中…");
        try {
          await withTimeout(sb.auth.updateUser({ data: { role: incomingRole } }), 10000, "updateUser");
          role = incomingRole;
        } catch (e) {
          console.error("[dashboard] updateUser failed:", e);
          setStatus("ステップ4 警告: " + e.message + " → メモリ上で続行");
          role = incomingRole;
        }
      }

      try { sessionStorage.removeItem("oauth_role"); } catch (_) {}

      if (role !== "golf" && role !== "caddy") {
        setStatus("エラー: role が確定できません → / に戻ります");
        setTimeout(() => { window.location.href = "/"; }, 2000);
        return;
      }

      // テーブル row が存在するかチェック（OAuth 初回ログインなら無いはず）
      const table = role === "golf" ? "golf_courses" : "caddies";
      setStatus("ステップ5: " + table + " テーブル検索中… (email=" + user.email + ")");
      let profile = null;
      let profileError = null;
      try {
        const res = await withTimeout(
          sb.from(table).select("email").eq("email", user.email).maybeSingle(),
          10000,
          table + " query"
        );
        profile = res.data;
        profileError = res.error;
      } catch (e) {
        setStatus("エラー (テーブル検索 timeout/失敗): " + e.message);
        return;
      }

      if (profileError) {
        setStatus("エラー (profileError): " + profileError.message);
        return;
      }

      routed = true;
      if (!profile) {
        setStatus("ステップ6: " + table + " に登録無し → /profile.html?role=" + role + " へ");
        window.location.href = `/profile.html?role=${role}`;
      } else {
        setStatus("ステップ6: 登録あり → " + (role === "golf" ? "/golf_dashboard.html" : "/caddy_dashboard.html") + " へ");
        if (role === "golf") {
          window.location.href = "/golf_dashboard.html";
        } else {
          window.location.href = "/caddy_dashboard.html";
        }
      }
    }

    // OAuth / メール認証 callback も SIGNED_IN を発火するので拾う
    sb.auth.onAuthStateChange(async (event, session) => {
      console.log("[dashboard] authState:", event);
      if (event === "SIGNED_IN" && session?.user) {
        setStatus("認証イベント SIGNED_IN を受信、ルーティング開始");
        await routeUser(session.user);
      }
    });

    // 初期チェック（既にセッションがある場合）
    (async () => {
      setStatus("ステップ1: getUser 実行中…");
      try {
        const userRes = await withTimeout(sb.auth.getUser(), 8000, "getUser");
        const user = userRes.data?.user;
        const authErr = userRes.error;
        console.log("[dashboard] initial user:", user, "authErr:", authErr);

        if (!user) {
          setStatus("ステップ1: セッション無し、1.5秒待って onAuthStateChange に委譲");
          setTimeout(async () => {
            if (routed) return;
            try {
              const r2 = await withTimeout(sb.auth.getUser(), 8000, "getUser(retry)");
              const u2 = r2.data?.user;
              if (!u2) {
                setStatus("セッションが見つかりません → / に戻ります");
                setTimeout(() => { window.location.href = "/"; }, 2000);
              } else {
                await routeUser(u2);
              }
            } catch (e) {
              setStatus("エラー (retry getUser): " + e.message);
            }
          }, 1500);
          return;
        }
        await routeUser(user);
      } catch (e) {
        console.error("[dashboard] fatal:", e);
        setStatus("致命的エラー: " + e.message);
      }
    })();

    // ログアウト処理
    document.getElementById("logout").onclick = async () => {
      await sb.auth.signOut();
      window.location.href = "/";
    };
  </script>
</body>
</html>
