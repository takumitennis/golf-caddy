<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>パスワード変更 | Caddygate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- LP framework を先に、dashboard を後に -->
  <link rel="stylesheet" href="/design-system/framework.css?v=2">
  <link rel="stylesheet" href="/design-system/dashboard-framework.css?v=2">

  <style>
    /* ── パスワード変更ページ固有レイアウト ── */
    .pw-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: var(--space-5);
      background: var(--color-bg);
    }
    .pw-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-7) var(--space-6);   /* 縦 48 / 横 32 */
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    .pw-card__brand {
      font-size: var(--fs-nano);                /* 11px (image fallback 用) */
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: var(--space-5);
    }
    .pw-card__brand img {
      height: 26px;
      width: auto;
      display: inline-block;
    }
    .pw-card__title {
      margin: 0 0 var(--space-2);
      font-size: var(--fs-xlarge);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.3;
      color: var(--color-ink);
    }
    .pw-card__desc {
      margin: 0 0 var(--space-6);
      font-size: var(--fs-small);
      letter-spacing: 0.02em;
      color: var(--color-ink-sub);
      line-height: 1.6;
    }
    .pw-hint {
      font-size: var(--fs-micro);
      color: var(--color-ink-mute);
      margin-top: var(--space-1);
      letter-spacing: 0.02em;
      line-height: 1.5;
    }
    .pw-submit {
      margin-top: var(--space-5);
      width: 100%;
    }
    .pw-back {
      display: inline-block;
      margin-top: var(--space-5);
      font-size: var(--fs-small);
      letter-spacing: 0.02em;
      color: var(--color-ink-sub);
      text-decoration: none;
    }
    .pw-back:hover {
      color: var(--color-primary);
    }
    .pw-msg {
      margin-top: var(--space-4);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--fs-small);
      display: none;
    }
    .pw-msg.ok {
      background: var(--color-primary-soft-bg);
      color: var(--color-primary-deep);
      display: block;
    }
    .pw-msg.err {
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
      display: block;
    }
  </style>
</head>
<body>
  <div class="pw-wrap">
    <div class="pw-card">
      <div class="pw-card__brand"><img src="/assets/logo-wordmark.png?v=3" alt="Caddygate" /></div>
      <h1 class="pw-card__title">パスワード変更</h1>
      <p class="pw-card__desc">ログイン中のアカウントのパスワードを更新します。</p>

      <form id="pwForm">
        <div class="form-field">
          <label class="form-label" for="newPw">新しいパスワード</label>
          <input class="form-input" id="newPw" type="password" required minlength="6" autocomplete="new-password" />
          <div class="pw-hint">6文字以上</div>
        </div>

        <div class="form-field">
          <label class="form-label" for="newPw2">新しいパスワード（確認）</label>
          <input class="form-input" id="newPw2" type="password" required minlength="6" autocomplete="new-password" />
        </div>

        <button id="submitBtn" type="submit" class="btn btn--primary pw-submit">変更する</button>
      </form>

      <div id="msg" class="pw-msg"></div>

      <a class="pw-back" href="/golf_dashboard.html">← マイページに戻る</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://dfvxzwrqkxklfutlzqiq.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdnh6d3Jxa3hrbGZ1dGx6cWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI4NzUsImV4cCI6MjA5NTgyODg3NX0.rRPwIqVfsdjGRkghv2X269oP75fOLm_w4Js16yWeh-Q"
    );

    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");

    // 未ログインなら login へ
    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) {
        location.href = "/";
        return;
      }
      // ロール判定して戻りリンクを切り替え
      const role = user.user_metadata?.role;
      const backLink = document.querySelector('.pw-back');
      if (backLink && role === 'caddy') {
        backLink.href = '/caddy_dashboard.html';
      }
    })();

    document.getElementById("pwForm").onsubmit = async (e) => {
      e.preventDefault();
      msg.className = "pw-msg";
      msg.textContent = "";

      const pw1 = document.getElementById("newPw").value;
      const pw2 = document.getElementById("newPw2").value;

      if (pw1 !== pw2) {
        msg.className = "pw-msg err";
        msg.textContent = "パスワードが一致しません";
        return;
      }

      btn.disabled = true;
      btn.textContent = "更新中...";

      const { error } = await sb.auth.updateUser({ password: pw1 });

      btn.disabled = false;
      btn.textContent = "変更する";

      if (error) {
        msg.className = "pw-msg err";
        msg.textContent = "エラー: " + error.message;
        return;
      }

      msg.className = "pw-msg ok";
      msg.textContent = "パスワードを変更しました。3秒後にマイページに戻ります。";
      setTimeout(async () => {
        const { data: { user } } = await sb.auth.getUser();
        const role = user?.user_metadata?.role;
        location.href = role === 'caddy' ? '/caddy_dashboard.html' : '/golf_dashboard.html';
      }, 3000);
    };
  </script>
</body>
</html>
