<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>提携ゴルフ場 - Golf-Caddy Matching Service</title>
  <style>
    :root {
      --primary-color: #2f8f2f;
      --primary-dark: #1e5f1e;
      --primary-light: #4caf50;
      --secondary-color: #ffffff;
      --accent-color: #ff6b35;
      --text-color: #333333;
      --text-light: #666666;
      --bg-light: #f8f9fa;
      --bg-dark: #2c3e50;
      --max-width: 1200px;
      --border-radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.15);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text-color);
      line-height: 1.6;
      background: var(--bg-light);
    }



    /* Navigation - 統一されたヘッダーのCSS */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.75rem 1.5rem;
      height: 80px;
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(2px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .top-nav.scrolled { background: rgba(0,0,0,0.7); }

    .nav-main {
      display: flex;
      gap: clamp(0.5rem, 2vw, 1.5rem);
      align-items: center;
      flex-wrap: nowrap;
      justify-content: center;
    }

    .nav-item {
      position: relative;
      flex-shrink: 0;
    }

    .nav-tab {
      color: #fff;
      text-decoration: none;
      padding: clamp(0.4rem, 1.2vw, 0.6rem) clamp(0.8rem, 2vw, 1.2rem);
      border-radius: 12px;
      font-weight: 500;
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: block;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-tab:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-1px);
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      min-width: 220px;
      opacity: 0;
      visibility: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,0.12);
      z-index: 1000;
      white-space: nowrap;
      transition: all 0.2s ease;
      margin-top: 0.25rem;
      padding: 6px 0;
    }

    .nav-item:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .dropdown-item {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      font-size: .86rem;
      font-weight: 500;
      border: none;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dropdown-item:hover { background: rgba(255,255,255,0.06); }

    .dropdown-item:last-child {
      border-bottom: none;
      border-radius: 0 0 12px 12px;
    }

    .dropdown-item:first-child {
      border-radius: 12px 12px 0 0;
    }

    /* モバイル対応 */
    @media (max-width: 768px) {
      .top-nav { 
        padding: 0.5rem 1rem; 
        height: 70px;
        justify-content: center; 
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }
      
      .nav-main {
        gap: clamp(0.3rem, 1.5vw, 0.8rem);
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 0 0.5rem;
        -webkit-overflow-scrolling: touch;
        width: 100%;
        justify-content: center;
      }
      
      .nav-item {
        flex-shrink: 0;
        width: auto;
        max-width: none;
      }
      
      .nav-tab {
        padding: 0.4rem 0.6rem;
        font-size: clamp(0.6rem, 2.2vw, 0.8rem);
        white-space: nowrap;
        border-radius: 6px;
        width: auto;
        letter-spacing: 0;
        text-shadow: none;
      }
      
      .dropdown-menu {
        min-width: auto;
        width: max-content;
        max-width: calc(100vw - 24px);
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) translateY(0) !important;
        padding: 4px 0;
        background: rgba(0,0,0,0.95) !important;
        border: 1px solid rgba(255,255,255,0.3) !important;
        box-shadow: 0 6px 20px rgba(0,0,0,0.4) !important;
        backdrop-filter: blur(10px) !important;
        border-radius: 8px !important;
        z-index: 1000 !important;
      }
      
      .dropdown-item {
        padding: 8px 12px;
        font-size: 0.75rem;
        white-space: nowrap;
      }
      
      .main-content {
        padding: 6rem 0.25rem 3rem;
        margin: 0;
        max-width: 100%;
      }

      .golf-courses-grid {
        grid-template-columns: 1fr;
        gap: 0;
        margin: 0 0 2rem 0;
        padding: 0;
      }

      .golf-course-card {
        margin: 0;
        width: 100%;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
        border: none;
        background: transparent;
      }

      .section-header {
        margin-bottom: 2rem;
        padding: 0 0.05rem;
      }

      .section-header h2 {
        font-size: 1.8rem;
      }

      .section-header p {
        font-size: 1rem;
        padding: 0 0.1rem;
      }

      .modal {
        padding: 1rem;
      }

      .modal-content {
        margin: 1rem;
      }

      .contact-info {
        grid-template-columns: 1fr;
      }

      /* パートナーシップセクションのカードスタイルを削除 */
      .partnership-section {
        background: transparent;
        border-radius: 0;
        padding: 2rem 0.25rem;
        box-shadow: none;
        margin-top: 2rem;
      }

      .partnership-section h3 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }

      .partnership-section p {
        font-size: 1rem;
        margin-bottom: 1.5rem;
        padding: 0 0.5rem;
      }

      .partnership-btn {
        padding: 0.875rem 1.5rem;
        font-size: 1rem;
      }
    }

    /* 小さいモバイル画面対応 */
    @media (max-width: 480px) {
      .main-content {
        padding: 6rem 0.1rem 2rem;
      }

      .golf-courses-grid {
        gap: 0;
        margin: 0 0 1.5rem 0;
      }

      .golf-course-card {
        border-radius: 0;
        box-shadow: none;
        border: none;
        background: transparent;
      }

      .course-content {
        padding: 0.5rem 0;
      }

      .course-name {
        font-size: 1.2rem;
      }

      .section-header h2 {
        font-size: 1.5rem;
      }

      .section-header p {
        font-size: 0.9rem;
        padding: 0 0.05rem;
      }

      /* 小さいモバイル画面でのパートナーシップセクション */
      .partnership-section {
        padding: 1.5rem 0.1rem;
        margin-top: 1.5rem;
      }

      .partnership-section h3 {
        font-size: 1.3rem;
      }

      .partnership-section p {
        font-size: 0.9rem;
        padding: 0 0.25rem;
      }

      .partnership-btn {
        padding: 0.75rem 1.25rem;
        font-size: 0.9rem;
      }
    }

    /* Main Content */
    .main-content {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 8rem 2rem 3rem; /* 固定ナビゲーション分のtop padding追加 */
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-header h2 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 1rem;
    }

    .section-header p {
      font-size: 1.1rem;
      color: var(--text-light);
      max-width: 800px;
      margin: 0 auto;
      padding: 0 0.1rem;
    }

    /* Golf Course Grid */
    .golf-courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
      margin-bottom: 4rem;
    }

    .golf-course-card {
      background: var(--secondary-color);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      cursor: pointer;
    }

    .golf-course-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .course-image {
      width: 100%;
      height: 250px;
      background: linear-gradient(135deg, #2d5a27 0%, #4a7c59 50%, #6b8e23 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .course-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .course-image::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(45,90,39,0.8) 0%, rgba(74,124,89,0.8) 50%, rgba(107,142,35,0.8) 100%);
      z-index: 1;
    }

    .course-image .course-icon {
      position: relative;
      z-index: 2;
    }

    .course-content {
      padding: 1.5rem 0.5rem;
      text-align: center;
    }

    .course-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    .course-address {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .course-address::before {
      content: '📍';
      font-size: 1rem;
    }

    .course-description {
      color: var(--text-color);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .course-features {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .feature-tag {
      background: var(--primary-light);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .view-details {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--border-radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
    }

    .view-details:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    /* Partnership Section */
    .partnership-section {
      background: transparent;
      border-radius: 0;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: none;
      margin-top: 4rem;
    }

    .partnership-section h3 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 1rem;
    }

    .partnership-section p {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .partnership-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: var(--border-radius);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      display: inline-block;
    }

    .partnership-btn:hover {
      background: #e55a2b;
      transform: translateY(-2px);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--secondary-color);
      border-radius: var(--border-radius);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      padding: 2rem 2rem 1rem;
      border-bottom: 1px solid #eee;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-light);
      padding: 0.5rem;
      border-radius: 50%;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--bg-light);
      color: var(--text-color);
    }

    .modal-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    .modal-subtitle {
      color: var(--text-light);
      font-size: 1rem;
    }

    .modal-body {
      padding: 1rem 2rem 2rem;
    }

    .modal-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #2d5a27 0%, #4a7c59 50%, #6b8e23 100%);
      border-radius: var(--border-radius);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--border-radius);
    }

    .modal-description {
      color: var(--text-color);
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .modal-features {
      margin-bottom: 1.5rem;
    }

    .modal-features h4 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 0.75rem;
    }

    .modal-features ul {
      list-style: none;
      padding-left: 0;
    }

    .modal-features li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
      color: var(--text-color);
    }

    .modal-features li:last-child {
      border-bottom: none;
    }

    .modal-contact {
      background: var(--bg-light);
      padding: 1.5rem;
      border-radius: var(--border-radius);
      margin-top: 1.5rem;
    }

    .modal-contact h4 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 1rem;
    }

    .contact-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-color);
    }

    .contact-item::before {
      font-size: 1.2rem;
    }

    .contact-item.phone::before {
      content: '📞';
    }

    .contact-item.email::before {
      content: '✉️';
    }



    /* Loading Animation */
    .loading {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease-out forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .golf-course-card:nth-child(1) { animation-delay: 0.1s; }
    .golf-course-card:nth-child(2) { animation-delay: 0.2s; }
    .golf-course-card:nth-child(3) { animation-delay: 0.3s; }
    .golf-course-card:nth-child(4) { animation-delay: 0.4s; }
    .golf-course-card:nth-child(5) { animation-delay: 0.5s; }
    .golf-course-card:nth-child(6) { animation-delay: 0.6s; }
  </style>
</head>

  <!-- Modal -->
  <div class="modal" id="courseModal">
    <div class="modal-content">
      <div class="modal-header">
        <button class="modal-close" id="modalClose">&times;</button>
        <h3 class="modal-title" id="modalTitle">ゴルフ場名</h3>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      "https://dfvxzwrqkxklfutlzqiq.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdnh6d3Jxa3hrbGZ1dGx6cWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI4NzUsImV4cCI6MjA5NTgyODg3NX0.rRPwIqVfsdjGRkghv2X269oP75fOLm_w4Js16yWeh-Q"
    );

    // モーダルの制御
    const modal = document.getElementById('courseModal');
    const modalClose = document.getElementById('modalClose');

    modalClose.onclick = () => {
      modal.classList.remove('show');

    modal.onclick = (e) => {
      if (e.target === modal) {
        modal.classList.remove('show');

    // ゴルフ場データの読み込みと表示
    async function loadGolfCourses() {
      try {
        console.log('=== ゴルフ場データ読み込み開始 ===');
        
        // まず、利用可能なテーブルを確認
        console.log('利用可能なテーブルを確認中...');
        
        // golf_coursesテーブルが存在するかテスト
        let golfCourses = [];
        let error = null;
        
        try {
          const { data, error: tableError } = await supabase
            .from('golf_courses')
            .select('*')
            .limit(1);
          
          if (tableError) {
            console.log('golf_coursesテーブルエラー:', tableError);
            // テーブルが存在しない場合、他の方法を試す
            throw new Error('golf_coursesテーブルが存在しません');
          }
          
          // テーブルが存在する場合、データを取得
          const { data: courses, error: dataError } = await supabase
            .from('golf_courses')
            .select('*')
            .not('name', 'is', null)
            .not('contact_name', 'is', null)
            .not('phone', 'is', null)
            .eq('partner_display', true);
          
          if (dataError) {
            console.error('データ取得エラー:', dataError);
            error = dataError;
          } else {
            golfCourses = courses || [];
          }
          
        } catch (tableError) {
          console.log('golf_coursesテーブルが存在しないため、代替方法を試行...');
          
          // 代替方法: caddiesテーブルから大学情報を取得してゴルフ部として表示
          try {
            const { data: caddies, error: caddyError } = await supabase
              .from('caddies')
              .select('university, created_at')
              .not('university', 'is', null)
              .neq('university', '');
            
            if (caddyError) {
              console.error('caddiesテーブル取得エラー:', caddyError);
            } else if (caddies && caddies.length > 0) {
              // 大学ごとにグループ化
              const universityMap = new Map();
              caddies.forEach(caddy => {
                if (caddy.university) {
                  if (!universityMap.has(caddy.university)) {
                    universityMap.set(caddy.university, {
                      gid: 'u_' + caddy.university.replace(/\s+/g, '_'),
                      name: caddy.university + ' ゴルフ部',
                      address: '所在地情報なし',
                      description: caddy.university + 'の学生で構成されるゴルフ部です。',
                      contact_name: '担当者情報なし',
                      phone: '電話番号情報なし',
                      email: 'メールアドレス情報なし',
                      perks: '学生主体の活動',
                      member_count: 0
                    });
                  }
                  universityMap.get(caddy.university).member_count++;
                }
              });
              
              golfCourses = Array.from(universityMap.values());
              console.log('大学情報から生成したゴルフ部:', golfCourses);
            }
          } catch (caddyError) {
            console.error('代替方法も失敗:', caddyError);
          }
        }

        console.log('最終的に取得したデータ:', golfCourses);

        if (!golfCourses || golfCourses.length === 0) {
          document.getElementById('golfCoursesGrid').innerHTML = 
            '<div style="text-align: center; padding: 3rem; color: var(--text-light);">現在、提携ゴルフ場はありません。<br><br>ゴルフ場の登録をお待ちしています。</div>';
          return;
        }

        // 全データを保持
        allGolfCourses = golfCourses;
        
        // ゴルフ場カードを生成
        displayGolfCourses(golfCourses);

      } catch (error) {
        console.error('=== ゴルフ場データ読み込みエラー ===');
        console.error('エラー詳細:', error);
        document.getElementById('golfCoursesGrid').innerHTML = 
          '<div style="text-align: center; padding: 3rem; color: var(--text-light);">データの読み込みに失敗しました。<br><br>エラー: ' + (error.message || error) + '</div>';
      }
    }

    // ゴルフ場カードの作成
    function createGolfCourseCard(course, index) {
      const card = document.createElement('div');
      card.className = 'golf-course-card loading';
      card.style.animationDelay = `${index * 0.1}s`;

      // 画像URLがある場合は使用、ない場合はデフォルトアイコン
      const imageContent = course.image_url 
        ? `<img src="${course.image_url}" alt="${course.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
        : '';

      card.innerHTML = `
        <div class="course-image">
          ${imageContent}
          <div class="course-icon" style="${course.image_url ? 'display: none;' : ''}">🏌️</div>
        </div>
        <div class="course-content">
          <h3 class="course-name">${course.name || 'ゴルフ場名未設定'}</h3>
          <div class="course-address">${course.prefecture || '都道府県未設定'}${course.city ? ' ' + course.city : ''}</div>
          <p class="course-description">${course.description ? course.description.substring(0, 100) + '...' : '詳細情報はありません'}</p>
          <div class="course-features">
            ${course.perks ? `<span class="feature-tag">${course.perks}</span>` : ''}
            ${course.prefecture ? `<span class="feature-tag">${course.prefecture}</span>` : ''}
          </div>
          <button class="view-details" onclick="showCourseDetails('${course.gid}')">詳細を見る</button>
        </div>
      `;

      return card;
    }

    // ゴルフ場詳細の表示
    async function showCourseDetails(gid) {
      try {
        const { data: course, error } = await supabase
          .from('golf_courses')
          .select('*')
          .eq('gid', gid)
          .single();

        if (error) {
          console.error('ゴルフ場詳細取得エラー:', error);
          alert('詳細情報の取得に失敗しました');
          return;
        }

        // モーダルの内容を更新
        document.getElementById('modalTitle').textContent = course.name || 'ゴルフ場名未設定';
        document.getElementById('modalSubtitle').textContent = course.address || '住所未設定';
        document.getElementById('modalDescription').textContent = course.description || '詳細情報はありません';
        
        // 画像の更新
        const modalImage = document.getElementById('modalImage');
        if (course.image_url) {
          modalImage.innerHTML = `<img src="${course.image_url}" alt="${course.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="course-icon" style="display: none;">🏌️</div>`;
        } else {
          modalImage.innerHTML = '<div class="course-icon">🏌️</div>';
        }

        // 特徴・アピールポイントの更新
        const features = [];
        if (course.perks) features.push(course.perks);
        if (course.prefecture) features.push(`所在地: ${course.prefecture}${course.city ? ' ' + course.city : ''}`);
        if (course.description) features.push('詳細な説明あり');

        const featuresList = document.getElementById('modalFeatures');
        if (features.length > 0) {
          featuresList.innerHTML = features.map(feature => `<li>${feature}</li>`).join('');
        } else {
          featuresList.innerHTML = '<li>特徴情報はありません</li>';
        }



        // モーダルを表示
        modal.classList.add('show');

      } catch (error) {
        console.error('ゴルフ場詳細表示エラー:', error);
        alert('詳細情報の表示に失敗しました');
      }
    }

    // 都道府県絞り込みの処理
    let allGolfCourses = []; // 全ゴルフ場データを保持
    
    function filterGolfCourses() {
      const selectedPrefecture = document.getElementById('prefectureFilter').value;
      const grid = document.getElementById('golfCoursesGrid');
      
      if (!selectedPrefecture) {
        // 全て表示
        displayGolfCourses(allGolfCourses);
        return;
      }
      
      // 選択された都道府県で絞り込み
      const filteredCourses = allGolfCourses.filter(course => 
        course.prefecture === selectedPrefecture
      );
      
      displayGolfCourses(filteredCourses);
    }
    
    function displayGolfCourses(courses) {
      const grid = document.getElementById('golfCoursesGrid');
      grid.innerHTML = '';
      
      if (courses.length === 0) {
        grid.innerHTML = '<div style="text-align: center; padding: 3rem; color: var(--text-light);">該当するゴルフ場がありません。</div>';
        return;
      }
      
      courses.forEach((course, index) => {
        const card = createGolfCourseCard(course, index);
        grid.appendChild(card);
      });
    }
    
    // ページ読み込み時にゴルフ場データを読み込み
    document.addEventListener('DOMContentLoaded', () => {
      loadGolfCourses();
      
      // 都道府県絞り込みのイベントリスナーを設定
      const prefectureFilter = document.getElementById('prefectureFilter');
      if (prefectureFilter) {
        prefectureFilter.addEventListener('change', filterGolfCourses);
      }
      
      // ドロップダウンメニューの動作を設定
      setupDropdownMenus();
    });
    
    // ドロップダウンメニューの動作を設定する関数（PC版とモバイル版両対応）
    function setupDropdownMenus() {
      const navItems = document.querySelectorAll('.nav-item');
      
      navItems.forEach((item) => {
        const dropdown = item.querySelector('.dropdown-menu');
        
        if (dropdown) {
          // マウスイベント（デスクトップ）
          item.addEventListener('mouseenter', () => {
            // 他のドロップダウンを閉じる
            closeAllDropdowns();
            // 現在のドロップダウンを開く
            openDropdown(dropdown);
          });
          
          item.addEventListener('mouseleave', () => {
            // 少し遅延を入れてドロップダウンを閉じる
            setTimeout(() => {
              if (!item.matches(':hover')) {
                closeDropdown(dropdown);
              }
            }, 100);
          });
          
          // タッチイベント（モバイル）- 改善版
          let touchStartTime = 0;
          let touchStartY = 0;
          
          item.addEventListener('touchstart', (e) => {
            touchStartTime = Date.now();
            touchStartY = e.touches[0].clientY;
          });
          
          item.addEventListener('touchend', (e) => {
            const touchEndTime = Date.now();
            const touchDuration = touchEndTime - touchStartTime;
            const touchEndY = e.changedTouches[0].clientY;
            const touchDistance = Math.abs(touchEndY - touchStartY);
            
            // 短時間のタッチ（タップ）のみを処理
            if (touchDuration < 300 && touchDistance < 10) {
              e.preventDefault();
              e.stopPropagation();
              
              // 他のドロップダウンを閉じる
              closeAllDropdowns();
              
              // 現在のドロップダウンの表示/非表示を切り替え
              const isVisible = dropdown.style.visibility === 'visible';
              if (isVisible) {
                closeDropdown(dropdown);
              } else {
                openDropdown(dropdown);
              }
            }
          });
          
          // ドロップダウンメニュー内のリンククリック
          dropdown.addEventListener('click', (e) => {
            if (e.target.tagName === 'A') {
              // リンクがクリックされた場合、ドロップダウンを閉じる
              closeAllDropdowns();
            }
          });
        }
      });
      
      // 画面外クリックでドロップダウンを閉じる
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.nav-item')) {
          closeAllDropdowns();
        }
      });
      
      // 画面外タッチでドロップダウンを閉じる
      document.addEventListener('touchend', (e) => {
        if (!e.target.closest('.nav-item')) {
          closeAllDropdowns();
        }
      });
    }
    
    // ドロップダウンを開く関数
    function openDropdown(dropdown) {
      dropdown.style.opacity = '1';
      dropdown.style.visibility = 'visible';
      dropdown.style.transform = 'translateX(-50%) translateY(0)';
    }
    
    // ドロップダウンを閉じる関数
    function closeDropdown(dropdown) {
      dropdown.style.opacity = '0';
      dropdown.style.visibility = 'hidden';
      dropdown.style.transform = 'translateX(-50%) translateY(-6px)';
    }
    
    // すべてのドロップダウンを閉じる関数
    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-menu').forEach(menu => {
        closeDropdown(menu);
      });
    }

    // Login Modal
    (function(){
      // ログインモーダルのHTML作成
      const modalHTML = `
        <div id="loginModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:1000;">
          <div style="background:white; border-radius:12px; padding:2rem; width:90%; max-width:400px; text-align:center; position:relative;">
            <button id="closeModal" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:24px; cursor:pointer;">×</button>
            
            <div id="loginForm">
              <h3 id="loginHeading" style="margin-bottom:1.5rem; color:#333; font-size:1.2rem; font-weight:bold;">ログイン</h3>
              
              <div style="margin-bottom:1rem; text-align:left;">
                <label style="display:block; margin-bottom:0.5rem; font-weight:500;">ログインID</label>
                <input id="modalEmail" type="email" placeholder="メールアドレスを入力" style="width:100%; padding:0.75rem; border:2px solid #ddd; border-radius:6px; font-size:1rem;" />
              </div>
              
              <div style="margin-bottom:1.5rem; text-align:left;">
                <label style="display:block; margin-bottom:0.5rem; font-weight:500;">パスワード</label>
                <input id="modalPassword" type="password" placeholder="パスワードを入力" style="width:100%; padding:0.75rem; border:2px solid #ddd; border-radius:6px; font-size:1rem;" />
              </div>
              
              <button id="modalLoginBtn" style="width:100%; background:#2e7d32; color:white; border:none; padding:0.875rem; border-radius:6px; font-size:1rem; font-weight:600; cursor:pointer; margin-bottom:1rem;">
                ログイン
              </button>
              
              <a href="#" id="modalSignupLink" style="color:#2e7d32; text-decoration:none; font-size:0.9rem;">
                新規登録はこちら
              </a>
            </div>
          </div>
        </div>
      `;
      
      // モーダルをbodyに追加
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      const modal = document.getElementById('loginModal');
      const closeBtn = document.getElementById('closeModal');
      const loginHeading = document.getElementById('loginHeading');
      const signupLink = document.getElementById('modalSignupLink');
      const loginBtn = document.getElementById('modalLoginBtn');
      let currentRole = '';
      
      // モーダルを開く関数
      const openModal = (role) => {
        currentRole = role;
        const roleText = role === 'golf' ? 'ゴルフ場' : 'キャディ';
        
        loginHeading.textContent = roleText + 'ログイン';
        signupLink.href = `login/index.html?role=${role}&mode=signup`;
        modal.style.display = 'flex';
      };
      
      // モーダルを閉じる関数
      const closeModal = () => {
        modal.style.display = 'none';
        document.getElementById('modalEmail').value = '';
        document.getElementById('modalPassword').value = '';
      };
      
      // イベントリスナー設定
      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      
      // ログインボタンのクリックイベントを設定
      document.addEventListener('click', (e) => {
        if (e.target.id === 'loginModalTrigger') {
          e.preventDefault();
          // ログイン選択メニューを表示
          loginHeading.textContent = 'ログイン';
          signupLink.href = `login/index.html?mode=signup`;
          modal.style.display = 'flex';
        }
      });
      

      
      // ログインボタン処理
      loginBtn.addEventListener('click', async () => {
        const email = document.getElementById('modalEmail').value;
        const password = document.getElementById('modalPassword').value;
        
        if (!email || !password) {
          alert('メールアドレスとパスワードを入力してください');
          return;
        }
        
        // 既存のlogin.htmlを利用したログイン処理
        try {
          loginBtn.textContent = 'ログイン中...';
          loginBtn.disabled = true;
          
          // Supabaseログイン（既存のlogin.htmlと同じ処理）
          const { data, error } = await supabase.auth.signInWithPassword({ 
            email: email,
            password: password 
          });
          
          if (error) {
            throw error;
          } else {
            // ログイン成功時の処理（既存のlogin.htmlと同じ）
            setTimeout(() => {
              location.href = currentRole === 'golf' ? 'golf_dashboard.html' : 'caddy_dashboard.html';
            }, 600);
          }
        } catch (error) {
          console.error('Login error:', error);
          alert('ログインに失敗しました: ' + error.message);
          loginBtn.textContent = 'ログイン';
          loginBtn.disabled = false;
        }
      });
      
      // Enterキーでログイン
      document.getElementById('modalPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          loginBtn.click();
        }
      });
    })();
  </script>
